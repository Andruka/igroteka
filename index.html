:root{
  --felt:#1b2559; --felt-2:#232f6e; --felt-3:#2d3a85;
  --ink:#0e1233; --paper:#eef1ff; --paper-2:#d9dffa; --muted:#9aa6e0;
  --coral:#ff6b57; --sun:#ffc233; --mint:#2fd6a0; --sky:#3aa0ff;
  --grape:#9a6bff; --pink:#ff7ab8; --lime:#b6e24b; --teal:#19c2c9;
  --accent:var(--sun);
  --display:"Bahnschrift","Arial Narrow","Roboto Condensed","DejaVu Sans Condensed","Liberation Sans Narrow",system-ui,sans-serif;
  --body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue","Liberation Sans",sans-serif;
  --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--felt);
  background-image:
    radial-gradient(1200px 600px at 15% -10%,rgba(122,140,255,.22),transparent 60%),
    radial-gradient(900px 500px at 100% 110%,rgba(255,107,87,.12),transparent 60%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 6px);
  background-attachment:fixed;
  color:var(--paper);
  font:400 clamp(16px,1.35vw + 9px,21px)/1.45 var(--body);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.02;margin:0;letter-spacing:.005em}
p{margin:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:10px}
.sr{position:absolute;left:-9999px}

/* ---------- кнопки ---------- */
.btn{
  --bg:var(--sun);
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  background:var(--bg);color:var(--ink);
  border:3px solid var(--ink);border-radius:16px;
  padding:.62em 1.15em;font-weight:800;cursor:pointer;
  box-shadow:0 5px 0 var(--ink);
  transition:transform .08s,box-shadow .08s,filter .15s;
  text-align:center;line-height:1.15;user-select:none;
}
.btn:hover{filter:brightness(1.07)}
.btn:active,.btn.pressed{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.big{font-size:1.25em;padding:.7em 1.5em;border-radius:20px}
.btn.huge{font-size:1.6em;padding:.75em 1.7em;border-radius:24px}
.btn.ghost{--bg:transparent;color:var(--paper);border-color:rgba(238,241,255,.35);box-shadow:none}
.btn.ghost:active{transform:none}
.btn.good{--bg:var(--mint)} .btn.bad{--bg:var(--coral)}
.btn.sky{--bg:var(--sky)} .btn.paper{--bg:var(--paper)}
.btn.small{font-size:.8em;padding:.45em .8em;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn.icon{padding:.45em .7em;font-size:.95em}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:1rem}
.grow{flex:1}

/* ---------- каталог ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:clamp(18px,3vw,40px)}
.hero{display:flex;flex-wrap:wrap;gap:1.2rem 3rem;align-items:flex-end;justify-content:space-between;margin-bottom:clamp(18px,3vw,36px)}
.hero h1{font-size:clamp(56px,10vw,132px);color:var(--paper);letter-spacing:-.01em}
.hero p{max-width:34ch;color:var(--muted);font-size:1.05em}
.hero .top{display:flex;gap:.6rem;align-items:center;margin-bottom:.8rem}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:clamp(16px,2.5vw,28px)}
.chipbtn{
  border:2px solid rgba(238,241,255,.28);background:transparent;color:var(--paper);
  border-radius:999px;padding:.35em 1em;cursor:pointer;font-weight:700;
}
.chipbtn[aria-pressed=true]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,265px),1fr));gap:clamp(16px,2vw,28px)}
.gcard{
  --c:var(--sun);
  position:relative;display:flex;flex-direction:column;text-align:left;cursor:pointer;
  background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:24px;overflow:hidden;
  padding:0;box-shadow:7px 8px 0 rgba(8,10,34,.75);
  transform:rotate(var(--rot,0deg));transition:transform .15s,box-shadow .15s;
}
.gcard:hover{transform:rotate(0) translateY(-4px);box-shadow:7px 13px 0 rgba(8,10,34,.75)}
.gcard:active{transform:translateY(2px);box-shadow:4px 4px 0 rgba(8,10,34,.75)}
.gcard .art{background:var(--c);border-bottom:3px solid var(--ink);display:grid;place-items:center;height:118px;font-size:64px;line-height:1}
.gcard .body{padding:.9rem 1.05rem 1.1rem;display:flex;flex-direction:column;gap:.35rem;flex:1}
.gcard h3{font-size:1.55em}
.gcard .tag{font-size:.88em;color:#3a4170;flex:1}
.gcard .meta{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.35rem}
.pill{background:var(--paper-2);border:2px solid var(--ink);border-radius:999px;padding:.05em .7em;font-size:.78em;font-weight:700}
.foot{margin-top:clamp(28px,4vw,56px);display:flex;gap:1rem 2rem;flex-wrap:wrap;color:var(--muted);align-items:center;font-size:.9em}

/* ---------- экран игры: вступление ---------- */
.intro{display:grid;gap:clamp(18px,3vw,36px);grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
@media(max-width:880px){.intro{grid-template-columns:1fr}}
.panel{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:var(--r);padding:clamp(16px,2vw,28px);box-shadow:7px 8px 0 rgba(8,10,34,.75)}
.panel h2{font-size:1.5em;margin-bottom:.5rem}
.panel.dark{background:var(--felt-2);color:var(--paper)}
.rules{display:flex;flex-direction:column;gap:.55rem}
.rules li{margin-left:1.1em}
.rules ul,.rules ol{margin:0;padding-left:.2em;display:flex;flex-direction:column;gap:.45rem}
.title-row{display:flex;gap:1rem;align-items:center;margin-bottom:1rem}
.title-row .ic{width:88px;height:88px;flex:none;display:grid;place-items:center;font-size:52px;background:var(--accent);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink)}
.title-row h1{font-size:clamp(40px,6vw,76px)}
.stepper{display:flex;align-items:center;gap:.8rem}
.stepper b{font-family:var(--display);font-size:2.2em;min-width:1.4em;text-align:center}
.teamrow{display:flex;gap:.6rem;align-items:center;margin:.4rem 0}
.dot{width:1.3em;height:1.3em;border-radius:50%;border:3px solid var(--ink);background:var(--c);flex:none}
.input{width:100%;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:.5em .8em;font-weight:700}
.seg{display:flex;gap:.4rem;flex-wrap:wrap}
.seg button{border:3px solid var(--ink);background:var(--paper-2);color:var(--ink);border-radius:12px;padding:.3em .85em;font-weight:800;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--sun);color:var(--ink);box-shadow:0 3px 0 var(--ink);transform:translateY(-2px)}
.label{font-weight:800;margin:.9rem 0 .35rem}

/* ---------- рамка игры ---------- */
.frame{min-height:100vh;display:flex;flex-direction:column}
.bar{display:flex;gap:.7rem;align-items:center;padding:.7rem clamp(12px,2vw,28px);background:rgba(14,18,51,.55);border-bottom:3px solid var(--ink);backdrop-filter:blur(4px)}
.bar-title{font-family:var(--display);font-weight:800;font-size:1.35em;flex:1;display:flex;align-items:center;gap:.5rem}
.bar-title i{font-style:normal;display:grid;place-items:center;width:1.8em;height:1.8em;background:var(--accent);border:2px solid var(--ink);border-radius:10px;font-size:.95em}
.board{display:flex;gap:.55rem;flex-wrap:wrap;padding:.8rem clamp(12px,2vw,28px) 0}
.tchip{
  --c:var(--sun);display:flex;align-items:center;gap:.6rem;background:var(--c);color:var(--ink);
  border:3px solid var(--ink);border-radius:14px;padding:.25em .8em .25em .45em;font-weight:800;
  box-shadow:0 3px 0 var(--ink);opacity:.72;transition:transform .15s,opacity .15s
}
.tchip.on{opacity:1;transform:translateY(-3px);box-shadow:0 7px 0 var(--ink)}
.tchip .sc{font-family:var(--display);font-size:1.45em;background:var(--ink);color:var(--paper);border-radius:9px;padding:0 .45em;min-width:1.6em;text-align:center}
.tchip.bump .sc{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.5)}}
.stage{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:clamp(14px,2.2vw,32px);display:flex;flex-direction:column;gap:clamp(14px,2vw,26px)}
.stage.mid{justify-content:center}

/* ---------- карточка на столе ---------- */
.card{
  background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:26px;
  padding:clamp(18px,3vw,44px);box-shadow:9px 10px 0 rgba(8,10,34,.75);
  display:flex;flex-direction:column;gap:1rem;position:relative
}
.card.accent{background:var(--accent)}
.card .kicker{font-weight:800;color:#4a5190;font-size:.95em}
.card.accent .kicker{color:rgba(14,18,51,.7)}
.big{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.6vw,60px);line-height:1.08}

  function reveal() {
    done = true; if (timer) timer.stop();
    bs.forEach((b, i) => { b.classList.toggle('right', items[i].ok); b.classList.toggle('dim', !items[i].ok && !wrong.has(i)); b.disabled = true; });
    if (c.explain) { exp.classList.remove('hidden'); exp.replaceChildren(h('div', { class: 'mid-t' }, c.explain)); }
    const nb = btn(c.last ? 'Итоги' : 'Дальше', c.next, 'big', { 'data-primary': true });
    actions.replaceChildren(nb); nb.focus();
  }
  function good(who, p) { sfx.ok(); api.score(who, p); say(api.teams[who].name + ': +' + pts(p) + '.'); reveal(); }
  function fail(i) { sfx.bad(); if (i != null && i >= 0) { bs[i].classList.add('wrong', 'shake'); bs[i].disabled = true; wrong.add(i); } }
  function steal() {
    if (c.steal === false || api.n < 2) { say('Верный ответ подсвечен.'); return reveal(); }
    const go = who => {
      stealer = who; actions.replaceChildren(); say(api.teams[who].name + ', ваш шанс: верный ответ даст ' + pts(half) + '.');
      if (timer) { timer.reset(c.time); timer.start(); }
    };
    if (api.n === 2) return go(1 - c.ti);
    say('Перехват за половину очков!');
    actions.replaceChildren(api.pickTeam('Кто перехватывает?', who => who < 0 ? (say('Никто не рискнул.'), reveal()) : go(who), { exclude: [c.ti], none: 'Никто' }));
  }
  function pickOpt(i) {
    if (done) return;
    if (stealer >= 0) { if (items[i].ok) return good(stealer, half); fail(i); say('И перехват не удался.'); return reveal(); }
    if (items[i].ok) return good(c.ti, full);
    fail(i); if (timer) timer.stop(); steal();
  }
  function timeUp() { if (done) return; sfx.buzz(); if (stealer >= 0) { say('Время вышло.'); return reveal(); } say('Время вышло!'); steal(); }
  api.show([
    h('div', { class: 'card accent' + (c.pic ? ' withpic' : '') }, c.pic || null, h('div', { class: 'qbody' }, h('div', { class: 'kicker' }, c.kicker), typeof c.title === 'string' ? h('div', { class: 'big' }, c.title) : c.title, timer ? timer.el : null)),
    h('div', { class: 'opts' }, bs), info, exp, actions
  ], { turn: c.ti });
  if (timer) timer.start();
}

/* ===================== Иллюстрации: подбор картинки по смыслу текста ===================== */
const Pics = (() => {
  let rules = null;
  const norm = s => String(s || '').toLowerCase().replace(/ё/g, 'е');
  function compile() {
    rules = [];
    DATA.pics.forEach(([e, stems]) => stems.trim().split(/\s+/).forEach(tok => {
      if (!tok) return;
      const tk0 = tok.replace(/_/g, " "); const whole = tok.endsWith('!'); const t = norm(tk0.replace(/!$/, '')).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '\\s+');
      rules.push({ e, re: new RegExp('(^|[^а-яa-z0-9])' + t + (whole ? '([^а-яa-z0-9]|$)' : '')), whole });
    }));
  }
  /* найти до max эмодзи по тексту, в порядке появления в тексте */
  function find(text, max = 2) {
    if (!rules) compile();
    const t = norm(text), hit = new Map();
    for (const r of rules) { const m = r.re.exec(t); if (m) { const i = m.index; if (!hit.has(r.e) || hit.get(r.e) > i) hit.set(r.e, i); } }
    return [...hit.entries()].sort((a, b) => a[1] - b[1]).slice(0, max).map(x => x[0]);
  }
  const hash = s => { let x = 7; for (const c of String(s)) x = (x * 31 + c.charCodeAt(0)) >>> 0; return x; };
  /* Наклейка: большой эмодзи на цветной плитке и до двух малых рядом.
     o: size 's'|'m'|'l'|'xl', tone (цвет), fallback (эмодзи, если ничего не нашлось), key (для наклона), flat (без наклона) */
  function sticker(emojis, o = {}) {
    const list = (emojis && emojis.length ? emojis : [o.fallback || '✨']).slice(0, 3);
    const tilt = o.flat ? 0 : ((hash(o.key || list.join('')) % 7) - 3) * .9;
    const el = h('div', { class: 'stk stk-' + (o.size || 'l'), style: { '--tilt': tilt + 'deg', ...(o.tone ? { '--tone': o.tone } : {}) }, 'aria-hidden': 'true' },
      h('span', { class: 'stk-main' }, list[0]),
      ...list.slice(1).map((e, i) => h('span', { class: 'stk-sub s' + (i + 1) }, e)));
    return el;
  }
  /* по тексту сразу в наклейку */
  function of(text, o = {}) { return sticker(find(text, o.max || 2), { key: text, ...o }); }
  const parts = s => typeof Intl !== 'undefined' && Intl.Segmenter ? [...new Intl.Segmenter('ru', { granularity: 'grapheme' }).segment(s)].map(x => x.segment) : Array.from(s);
  return { find, sticker, of, hash, parts };
})();

    ],
    cards: () => DATA.quiz.length,
    start(api) {
      rotate(api, api.opts.rounds, (ti, k, total, next, last) => {
        const tiles = DATA.quizCats.map(c => h('div', { class: 'tile' },
          h('h3', null, h('span', null, c.icon), c.name),
          h('div', { class: 'lv' }, [1, 2, 3].map(l => btn(String(l * 100), () => ask(c, l), 'small', { title: LV[l] })))));
        api.show([
          turnHead(api, ti, 'Вопрос ' + k + ' из ' + total + '. Выберите тему и очки.'),

        ], { turn: ti });

          });
        }
      });
    }
  });
}

/* 2. Эмодзи-кино — угадать фильм, мультфильм или сериал по смайликам */
{
  const deck = makeDeck('emoji', DATA.emoji);
  const pattern = n => n.split(' ').map(w => w[0] + w.slice(1).replace(/[А-Яа-яЁёA-Za-z0-9]/g, '_')).join('  ');
  registerGame({
    id: 'emoji', title: 'Эмодзи-кино', icon: '🎬', color: '#ff7ab8',
    cats: ['Викторины', 'Для компании', 'Для двоих'], teams: { min: 1, max: 8 }, mins: 25,
    tagline: 'Смайлики зашифровали название фильма, мультфильма или сериала. Кто угадает быстрее?',
    rules: '<ul><li>Команда видит цепочку смайликов и угадывает название. Достаточно назвать его близко к оригиналу.</li><li>Чем меньше подсказок, тем больше очков: <b>3</b> без подсказки, <b>2</b> с первой, <b>1</b> со второй.</li><li>Когда время вышло или команда готова ответить, нажмите «Показать ответ» и отметьте, кто назвал верно.</li><li>Если угадала другая команда, она получает 1 очко.</li></ul>',
    opts: [
      { key: 'rounds', label: 'Загадок у каждой команды', values: [3, 5, 8], def: 5 },
      { key: 'level', label: 'Сложность', values: [[0, 'Любая'], [1, 'Лёгкая'], [2, 'Средняя'], [3, 'Сложная']], def: 0 },
      { key: 'time', label: 'Время на загадку', values: [[30, '30 секунд'], [45, '45 секунд'], [60, '60 секунд']], def: 45 }
    ],
    cards: () => DATA.emoji.length,
    start(api) {
      rotate(api, api.opts.rounds, (ti, k, total, next, last) => {
        const lvl = api.opts.level; const c = deck.draw(x => !lvl || x.l === lvl);
        let hints = 0, revealed = false;
        const timer = Timer(api.opts.time, { onEnd: () => reveal() });
        const hintBox = h('div', { class: 'mid-t' }), actions = h('div', { class: 'row' }), after = h('div', { class: 'stack' });
        const hintBtn = btn('Подсказка (−1 очко)', () => {
          hints++; sfx.ding();
          hintBox.replaceChildren(h('div', null, c.t + ', слов в названии: ' + c.n.split(' ').length), hints > 1 ? h('div', { class: 'big', style: { letterSpacing: '.08em' } }, pattern(c.n)) : null);
          if (hints >= 2) hintBtn.disabled = true;
          kick.textContent = 'Угадайте название · ' + points() + ' ' + plural(points(), 'очко', 'очка', 'очков');
        }, 'paper');
        const points = () => Math.max(1, 3 - hints);
        const kick = h('div', { class: 'kicker' }, 'Угадайте название · 3 очка');
        function reveal() {
          if (revealed) return; revealed = true; timer.stop(); sfx.ding();
          actions.replaceChildren(); hintBtn.disabled = true;
          const p = points();
          after.replaceChildren(
            h('div', { class: 'ans' }, h('div', { class: 'kv' }, h('span', { class: 'badge' }, c.t), h('span', { class: 'big' }, c.n))),
            api.pickTeam('Кто назвал правильно?', who => {
              if (who === ti) { api.score(ti, p); sfx.ok(); } else if (who >= 0) { api.score(who, 1); sfx.ok(); } else sfx.bad();
              after.replaceChildren(btn(last ? 'Итоги' : 'Дальше', next, 'big', { 'data-primary': true })); after.firstChild.focus();
            }, { none: 'Никто не угадал' }));
        }
        actions.append(btn('Показать ответ', reveal, 'big', { 'data-primary': true }), hintBtn);
        api.show([
          turnHead(api, ti, 'Загадка ' + k + ' из ' + total),
          h('div', { class: 'card center' }, kick, h('div', { class: 'emoji-big' }, c.e), timer.el, hintBox),
          actions, after
        ], { turn: ti });
        timer.start();
      });
    }
  });
}

/* 4. Дилеммы — угадай, что выберет другой игрок */
{
  const deck = makeDeck('dilemma', DATA.dilemmas);
  registerGame({
    id: 'dilemma', title: 'Дилеммы', icon: '⚖️', color: '#9a6bff',
    cats: ['Для двоих', 'Для компании'], teams: { min: 2, max: 8 }, unit: 'Игрок', unitOne: 'игрок', unitFew: 'игрока', unitMany: 'игроков', unitTitle: 'Кто играет', mins: 20,
    tagline: 'Выбор из двух вариантов. Один отвечает по-настоящему, остальные угадывают, что он выберет.',
    rules: '<ul><li>В каждом раунде один игрок «в центре». Ему показывают дилемму: вариант А или вариант Б.</li><li>Остальные <b>угадывают</b> его выбор: на счёт «три» показывают пальцами 1 (А) или 2 (Б).</li><li>Затем игрок в центре нажимает свой настоящий выбор, а вы отмечаете, кто угадал.</li><li>Угадавшие получают по очку. Игрок в центре тоже получает очки за тех, кто ошибся: до двух.</li><li>В конце — по желанию — объясните свой выбор. Спорить можно и нужно.</li></ul>',
    opts: [
      { key: 'rounds', label: 'Раз в центре у каждого', values: [2, 3, 5], def: 3 },
      { key: 'kind', label: 'Какие дилеммы', values: [['', 'Любые'], ['f', 'Весёлые'], ['h', 'Сложный выбор']], def: '' }
    ],
    cards: () => DATA.dilemmas.length,
    start(api) {
      rotate(api, api.opts.rounds, (ti, k, total, next, last) => {
        const d = deck.draw(x => !api.opts.kind || x.k === api.opts.kind);
        const flip = Math.random() < .5, A = flip ? d.b : d.a, B = flip ? d.a : d.b;
        const name = api.teams[ti].name;
        const vs = (onPick, sel) => {
          /* у двух вариантов не должно быть одной и той же главной картинки */
          const fa = Pics.find(A, 3), fb = Pics.find(B, 3), shared = fa.filter(e => fb.includes(e));
          const order = (l, o) => l.filter(e => !shared.includes(e)).concat(l.filter(e => shared.includes(e)));
          let ea = order(fa), eb = order(fb);
          if (ea[0] && ea[0] === eb[0]) eb = ['💭', ...eb.slice(0, 1)];
          const pics = { 'А': ea, 'Б': eb };
          const mk = (cls, letter, text) => {
            const pic = Pics.sticker(pics[letter].slice(0, 2), { size: 'l', flat: true, key: text, fallback: letter === 'А' ? '💭' : '🤔' });
            return onPick
              ? h('button', { class: 'vsopt ' + cls, type: 'button', onclick: () => onPick(letter) }, h('b', null, letter), pic, h('span', { class: 'vt' }, text))
              : h('div', { class: 'vsopt ' + cls + (sel && sel !== letter ? ' dim' : '') + (sel === letter ? ' sel' : '') }, h('b', null, letter), pic, h('span', { class: 'vt' }, text));
          };
          return h('div', { class: 'vs' }, mk('a', 'А', A), h('div', { class: 'vs-or' }, 'или'), mk('b', 'Б', B));
        };
        const others = range(api.n).filter(i => i !== ti);
        step1();
        function step1() {
          api.show([
            turnHead(api, ti, 'Раунд ' + k + ' из ' + total + '. Что выберет ' + name + '?'),
            vs(),
            h('p', { class: 'mid-t' }, (others.length === 1 ? api.teams[others[0]].name + ', на' : 'Остальные, на') + ' счёт «три» покажите пальцами: 1 — вариант А, 2 — вариант Б.'),
            btn('Угадали — показываем выбор', step2, 'big', { 'data-primary': true })
          ], { turn: ti });
        }
        function step2() {
          api.show([
            turnHead(api, ti, name + ', каков ваш настоящий выбор?'),
            vs(letter => step3(letter))
          ], { turn: ti });
        }
        function step3(choice) {
          const right = new Set();
          const picks = h('div', { class: 'picks' });
          const paint = () => picks.replaceChildren(...others.map(i => {
            const on = right.has(i);
            const pb = btn(api.teams[i].name, () => { on ? right.delete(i) : right.add(i); paint(); }, 'big pick', { style: { '--c': api.teams[i].color, opacity: on ? 1 : .55 } }); if (on) pb.prepend(ico('check')); return pb;
          }));
          paint();
          api.show([
            turnHead(api, ti, name + ' выбрал(а) вариант ' + choice + '.'),
            vs(null, choice),
            h('div', { class: 'stack' }, h('div', { class: 'mid-t' }, 'Кто угадал? Нажмите на тех, кто показал такой же вариант.'), picks),
            btn('Готово', () => done(choice, right), 'big', { 'data-primary': true })
          ], { turn: ti });
        }
        function done(choice, right) {
          right.forEach(i => api.score(i, 1));

    opts: [{ key: 'nights', label: 'Сложность (ночей на расследование)', values: [[8, 'Лёгкая, 8'], [7, 'Средняя, 7'], [6, 'Сложная, 6']], def: 7 },
      { key: 'sus', label: 'Подозреваемых', values: [5, 6, 8], def: 6 }],
    start(api) {
      const D = DATA.det;
      const sc = pick(D.places), N = api.opts.sus;
      /* имена и профессии */
      const names = shuffle([...D.male, ...D.female]).slice(0, N), roles = shuffle(sc.roles).slice(0, N);
      const attr = (k, v) => v;
      /* преступник и «двойники» по видимым приметам */
      const culprit = { coat: pick(D.coat), height: pick(D.height), item: pick(D.item), hand: pick(D.hand), trait: pick(D.trait) };
      const sus = [];
      const sameVis = N >= 6 ? 2 : 1;
      const key = s => ['coat', 'height', 'item', 'hand', 'trait'].map(k => s[k].n).join('|');
      const mkOther = vis => {
        for (let t = 0; t < 200; t++) {
          const s = { coat: pick(D.coat), height: pick(D.height), item: pick(D.item), hand: pick(D.hand), trait: pick(D.trait) };
          const same = s.coat.n === culprit.coat.n && s.height.n === culprit.height.n;
          if (vis !== same) continue;
          if (vis) { /* двойник: отличается минимум двумя скрытыми, чтобы его можно было отличить */
            let d = 0; ['item', 'hand', 'trait'].forEach(k => { if (s[k].n !== culprit[k].n) d++; });
            if (d < 2) continue;
          }
          if (sus.some(o => key(o) === key(s)) || key(s) === key(culprit)) continue;
          return s;
        }
        return null;
      };
      sus.push(culprit);
      for (let i = 0; i < sameVis; i++) { const s = mkOther(true); if (s) sus.push(s); }
      while (sus.length < N) { const s = mkOther(false); if (!s) break; sus.push(s); }
      /* ещё нужен ли второй вариант при нехватке (маловероятно) */
      const order = shuffle(range(sus.length));
      const list = order.map((idx, i) => ({ ...sus[idx], name: names[i], role: roles[i], culprit: idx === 0, open: false, out: false }));
      const guilty = list.findIndex(s => s.culprit);

      const q = {
        wit: shuffle(['coat', 'height']),
        scene: shuffle(['item', 'hand']),
        cam: ['trait']
      };
      const notes = [];
      let left = api.opts.nights, flash = '', mode = 'main';
      const names2 = {
        wit: ['Опросить свидетелей', 'ask'], scene: ['Осмотреть место', 'search'], cam: ['Проверить записи камер', 'cam']
      };
      render();
      function use(src) {
        if (left <= 0) return;

        const k = q[src].shift(); left--; notes.push(culprit[k].clue); sfx.ok(); flash = ''; render();
      }
      function ask(i) {
        const s = list[i]; if (left <= 0 && !s.open) return;
        if (!s.open) { s.open = true; left--; sfx.ok(); }
        mode = 'main'; flash = 'Допрос: ' + s.name + '. ' + pick(D.mood); render();
      }
      function accuse(i) {
        const s = list[i], right = i === guilty;
        mode = 'done';
        const used = api.opts.nights - left;
        api.end({
          win: right, title: right ? 'Дело раскрыто!' : 'Преступник ушёл',

        });
      }

      /* портрет подозреваемого: цвет одежды и рост видны сразу, предмет — после допроса */
      function avatar(s) {
        const hs = Pics.hash(s.name), skin = ['#f2c9a0', '#e0a878', '#c68b5c', '#8d5a3b', '#f6d7b8'][hs % 5], hair = ['#2b1d12', '#6b3f1d', '#c9a227', '#a33b1c', '#555', '#111'][(hs >> 3) % 6];
        const coat = { 'красный': '#e84a4a', 'синий': '#3a82e0', 'зелёный': '#2f9e6a', 'чёрный': '#262633', 'серый': '#8d93a6', 'жёлтый': '#f0b72f' }[s.coat.n];
        const sc = { 'высокий': 1, 'средний': .86, 'невысокий': .72 }[s.height.n];
        const long = (hs >> 5) % 2 === 0;
        let item = '';
        if (s.open) item = {
          'очки': '<g fill="none" stroke="#111" stroke-width="2"><circle cx="43" cy="62" r="6"/><circle cx="57" cy="62" r="6"/><path d="M49 62h2"/></g>',
          'шляпа': '<ellipse cx="50" cy="48" rx="28" ry="6" fill="#5b3a29"/><path d="M36 48c0-16 28-16 28 0z" fill="#7a4e36"/>',
          'перчатки': '<circle cx="19" cy="112" r="7" fill="#f5f5f5" stroke="#999"/><circle cx="81" cy="112" r="7" fill="#f5f5f5" stroke="#999"/>',
          'портфель': '<rect x="66" y="104" width="26" height="20" rx="3" fill="#8a5a2b"/><path d="M73 104v-4h12v4" fill="none" stroke="#5a3a1a" stroke-width="2"/>',
          'зонт': '<path d="M12 70v54" stroke="#222" stroke-width="3"/><path d="M-6 76a18 16 0 0 1 36 0z" fill="#d94b8b"/>',
          'шарф': '<path d="M36 80q14 10 28 0l4 10q-18 12-36 0z" fill="#e8d3a0" stroke="#b79a5a"/>'
        }[s.item.n] || '';
        return h('div', { class: 'avatar', html: '<svg viewBox="-10 0 120 140" role="img" aria-label="' + s.name + '"><g transform="translate(50 140) scale(' + sc + ') translate(-50 -140)">' +
          '<path d="M16 140V98q0-14 20-18h28q20 4 20 18v42z" fill="' + coat + '"/><path d="M40 80l10 14 10-14z" fill="#f5f5f5" opacity=".9"/>' +
          '<rect x="44" y="72" width="12" height="12" fill="' + skin + '"/>' +
          (long ? '<path d="M30 62c0-26 40-26 40 0v22h-8V66H38v18h-8z" fill="' + hair + '"/>' : '') +
          '<circle cx="50" cy="62" r="18" fill="' + skin + '"/>' +
          '<path d="M32 60c0-22 36-22 36 0c-6-8-30-8-36 0z" fill="' + hair + '"/>' +
          '<circle cx="43" cy="63" r="2.2" fill="#222"/><circle cx="57" cy="63" r="2.2" fill="#222"/><path d="M44 71q6 4 12 0" fill="none" stroke="#7a3b2e" stroke-width="2" stroke-linecap="round"/>' +
          item + '</g>' + (s.open ? '' : '<g><circle cx="94" cy="20" r="12" fill="#ffc233"/><text x="94" y="26" text-anchor="middle" font-size="16" font-weight="800" fill="#0e1233">?</text></g>') + '</svg>' });
      }
      function card(s, i, onclick, extra) {
        return h('button', { type: 'button', class: 'susp' + (s.out ? ' out' : '') + (extra || ''), onclick },
          avatar(s), h('b', null, s.name), h('i', null, s.role),
          h('span', null, 'Одежда: ' + s.coat.n), h('span', null, 'Рост: ' + s.height.n),

      }
      function render() {

            btn('Назад', () => { mode = 'main'; render(); }, 'paper')

            ...['wit', 'scene', 'cam'].map(src => withIco(btn(names2[src][0] + (q[src].length ? '' : ' (пусто)'), () => use(src), 'big sky', { disabled: left <= 0 || !q[src].length }), names2[src][1])),
            withIco(btn('Допросить', () => { mode = 'ask'; render(); }, 'big sky', { disabled: left <= 0 && list.every(s => s.open) }), 'ask'),
            withIco(btn('Обвинить', () => { mode = 'accuse'; render(); }, 'big bad', { 'data-primary': left <= 0 || undefined }), 'flag'))
        ], { turn: -1 });
      }
    }
  });

    tagline: 'Вы — ведущий ночного радио. Что-то происходит, а решать нужно прямо в эфире. Много концовок.',

      else {
        /* предпочитаем историю, где осталось больше неоткрытых концовок */
        const left = s => Object.entries(s.nodes).filter(([id, n]) => n.k && !(seenAll[s.id] || []).includes(id)).length;
        const mx = Math.max(...stories.map(left));

          h('div', { class: 'opts' }, n.c.map(([label, to], i) => h('button', { class: 'opt', type: 'button', onclick: () => { sfx.click(); go(to); } }, h('b', null, 'АБВГ'[i]), h('span', null, label))))
        ], { turn: -1 });
      }
      function finish(id, n) {
        const seen = store.get('endings', {}); const arr = seen[st.id] || [];
        const isNew = !arr.includes(id); if (isNew) { arr.push(id); seen[st.id] = arr; store.set('endings', seen); }
        const label = { good: 'Хорошая концовка', mid: 'Спорная концовка', bad: 'Плохая концовка' }[n.k];
        api.end({
          art: art(id, 'xl'), win: n.k !== 'bad', title: n.title, sub: label + (isNew ? ' · новая' : ''), custom: true,
          lines: [n.t, 'Открыто концовок в этой истории: ' + arr.length + ' из ' + total + '. Попробуйте сыграть ещё раз и выбрать другие варианты.']
        });
      }
    }
  });
}

{

    anagram() { const w = wordDeck.draw(x => x.length >= 5 && x.length <= 8); let s = w; for (let i = 0; i < 20 && s === w; i++) s = shuffle([...w]).join(''); return { type: 'anagram', body: ['Буквы перемешаны. Соберите слово.', h('div', { class: 'cipher' }, s.toUpperCase())], ans: [w], hint: 'Слово начинается на «' + w[0].toUpperCase() + '».' }; },
    rev() { const w = wordDeck.draw(x => x.length >= 4 && x.length <= 8); return { type: 'rev', body: ['Слово прочитано справа налево.', h('div', { class: 'cipher' }, [...w].reverse().join('').toUpperCase())], ans: [w], hint: 'Слово заканчивается на «' + w[w.length - 1].toUpperCase() + '».' }; },
    seq() {

      if (kind === 'arith') { const s = 2 + rnd(9), d = 2 + rnd(8); a = range(6).map(i => s + d * i); hint = 'Прибавляйте одно и то же число.'; }
      else if (kind === 'geom') { const s = 1 + rnd(3), r = 2 + rnd(2); a = range(6).map(i => s * Math.pow(r, i)); hint = 'Каждое число умножается на одно и то же.'; }

      else if (kind === 'fib') { let x = 1 + rnd(4), y = 2 + rnd(4); a = [x, y]; for (let i = 0; i < 4; i++) { a.push(a[a.length - 1] + a[a.length - 2]); } hint = 'Каждое число — сумма двух предыдущих.'; }

        const [p, w] = score(g, secret); const next = cands.filter(s => { const r = score(g, s); return r[0] === p && r[1] === w; });

/* 14. Обезвредить — бомба и инструкция, каждая игра с новыми правилами */
{
  const COL = [
    { id: 'red', n: 'красный', g: 'красных', f: 'красная', hex: '#ff4d4d' }, { id: 'blue', n: 'синий', g: 'синих', f: 'синяя', hex: '#3aa0ff' },
    { id: 'yellow', n: 'жёлтый', g: 'жёлтых', f: 'жёлтая', hex: '#ffd23a' }, { id: 'white', n: 'белый', g: 'белых', f: 'белая', hex: '#f2f2f2' },
    { id: 'black', n: 'чёрный', g: 'чёрных', f: 'чёрная', hex: '#1a1a22' }, { id: 'green', n: 'зелёный', g: 'зелёных', f: 'зелёная', hex: '#2fd68a' }
  ];
  const LABELS = ['СТОП', 'ЖМИ', 'ПУСК', 'ДЕРЖИ'];
  const BCOL = COL.filter(c => ['red', 'blue', 'yellow', 'white'].includes(c.id));
  const ORD = ['первый', 'второй', 'третий', 'четвёртый', 'пятый', 'шестой'];
  const ORDV = ['первый', 'второй', 'третий', 'четвёртый', 'пятый', 'шестой'];

  /* условия для проводов */
  const wireConds = () => {
    const c = pick(COL), c2 = pick(COL);
    return [
      { t: 'последняя цифра серийного номера нечётная', f: b => b.serialDigit % 2 === 1 },
      { t: 'последняя цифра серийного номера чётная', f: b => b.serialDigit % 2 === 0 },
      { t: 'батареек две и больше', f: b => b.bat >= 2 },
      { t: 'батареек нет', f: b => b.bat === 0 },
      { t: 'индикатор горит', f: b => b.lit },
      { t: 'индикатор не горит', f: b => !b.lit },
      { t: 'есть ' + c.n + ' провод', f: b => b.wires.some(w => w.id === c.id), col: c },
      { t: 'нет ' + c.g + ' проводов', f: b => !b.wires.some(w => w.id === c.id) },
      { t: 'последний провод ' + c2.n, f: b => b.wires[b.wires.length - 1].id === c2.id, col: c2 },
      { t: 'ровно один ' + c.n + ' провод', f: b => b.wires.filter(w => w.id === c.id).length === 1, col: c },
      { t: 'больше одного ' + c.n + ' провода', f: b => b.wires.filter(w => w.id === c.id).length > 1 }
    ];
  };
  function genWireRules(count) {
    const conds = shuffle(wireConds()).slice(0, 3);
    const used = new Set();
    const pool = [
      { k: 'last', t: 'последний провод', f: b => b.wires.length - 1 },
      { k: 'first', t: 'первый провод', f: () => 0 },
      { k: 'second', t: 'второй провод', f: () => 1 },
      { k: 'third', t: 'третий провод', f: () => 2 },
      { k: 'prelast', t: 'предпоследний провод', f: b => b.wires.length - 2 }
    ];
    const rules = conds.map(c => {
      let a;
      if (c.col && Math.random() < .5 && !/последний провод/.test(c.t) && !used.has('col' + c.col.id)) { used.add('col' + c.col.id); a = { t: 'первый ' + c.col.n + ' провод', f: b => b.wires.findIndex(w => w.id === c.col.id) }; }
      else { const opts = shuffle(pool.filter(x => !used.has(x.k))); a = opts[0]; used.add(a.k); }
      return { c, a };
    });
    const left = shuffle(pool.filter(x => !used.has(x.k)));
    const d = left[0] || pool[0];
    return { rules, def: d };
  }
  /* правила кнопки */
  function genButtonRules() {
    const lab = pick(LABELS), col = pick(BCOL), lab2 = pick(LABELS.filter(x => x !== lab));
    const conds = shuffle([
      { t: 'на кнопке «' + lab + '»', f: b => b.btn.label === lab },
      { t: 'кнопка ' + col.f, f: b => b.btn.col.id === col.id },
      { t: 'батареек две и больше', f: b => b.bat >= 2 },
      { t: 'индикатор горит', f: b => b.lit },
      { t: 'на кнопке «' + lab2 + '»', f: b => b.btn.label === lab2 }
    ]).slice(0, 3);
    const digs = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]);
    const rules = conds.map((c, i) => ({ c, a: i === 1 ? { t: 'сразу нажмите', f: () => null } : { t: 'нажмите, когда в секундах на таймере есть цифра ' + digs[i], f: () => digs[i] } }));
    return { rules, def: { t: 'нажмите, когда в секундах на таймере есть цифра ' + digs[3], f: () => digs[3] } };
  }
  function genBomb(modules) {
    const count = pick([4, 5, 6]);
    const wires = range(count).map(() => pick(COL));
    const serial = shuffle('ABCDEFGHJKLMNPRSTUVXZ'.split('')).slice(0, 3).join('') + (10 + rnd(90)) + pick('ABCDEFGHJKLMNPRSTUVXZ'.split('')) + (1 + rnd(9));
    return { wires, bat: rnd(5), lit: Math.random() < .5, serial, serialDigit: +serial.slice(-1), btn: { label: pick(LABELS), col: pick(BCOL) }, modules };
  }
  const solveWire = (b, rs) => { const r = rs[b.wires.length].rules.find(x => x.c.f(b)); return (r ? r.a : rs[b.wires.length].def).f(b); };
  const solveBtn = (b, bs) => { const r = bs.rules.find(x => x.c.f(b)); return (r ? r.a : bs.def).f(b); };

  registerGame({
    id: 'defuse', title: 'Обезвредить', icon: '✂️', color: '#ff7ab8',
    cats: ['Для компании', 'Командные', 'Для двоих', 'Загадки и истории'], teams: { min: 1, max: 1 }, coop: true, noBoard: true, unit: 'Игрок', unitOne: 'игрок', unitFew: 'игрока', unitMany: 'игроков', mins: 15,
    tagline: 'Перед вами бомба, и у вас есть инструкция. Найдите правильный провод до взрыва. Правила новые каждую игру.',
    rules: '<ul><li>На экране две страницы: <b>«Бомба»</b> и <b>«Инструкция»</b>. Таймер идёт, пока вы читаете любую из них.</li><li>Бомбу видите вы все. Читайте приметы: серийный номер, батарейки, индикатор, цвета проводов, кнопку.</li><li>В инструкции написано, какой провод перерезать и когда нажимать кнопку. Правила проверяются сверху вниз: сработало первое подходящее.</li><li>Ошибка даёт <b>промах</b>. Два промаха или конец таймера — бомба взрывается.</li><li>Инструкция меняется с каждой новой игрой, так что запомнить её наизусть не получится.</li></ul>',
    opts: [
      { key: 'bombs', label: 'Бомб', values: [3, 5, 7], def: 5 },
      { key: 'mods', label: 'Модули', values: [[1, 'Только провода'], [2, 'Провода и кнопка']], def: 2 },
      { key: 'time', label: 'Время на бомбу', values: [[90, '90 секунд'], [120, '2 минуты'], [180, '3 минуты']], def: 120 }
    ],
    cards: () => 0,
    start(api) {
      const wr = { 4: genWireRules(4), 5: genWireRules(5), 6: genWireRules(6) }, br = genButtonRules();
      const total = api.opts.bombs; let n = 0, ok = 0, boom = 0;
      next();
      function next() {
        if (n >= total) return end();
        n++;
        const b = genBomb(api.opts.mods);
        api.show(h('div', { class: 'cover' }, h('div', { class: 'kicker' }, 'Бомба ' + n + ' из ' + total), h('div', { class: 'big' }, 'К бомбе!'),
          h('p', { class: 'mid-t' }, 'Время: ' + fmtTime(api.opts.time) + '. Два промаха — и бабах. Инструкция всегда под рукой.'),
          btn('Приступить', () => play(b), 'big', { 'data-primary': true }), btn('Прочитать инструкцию без таймера', () => manualOnly(b), 'paper')), { turn: -1, mid: true });
      }
      function manualPage() {
        const sec = (title, rules, def, keyword) => h('div', { class: 'card' }, h('div', { class: 'kicker' }, title),
          h('ol', { class: 'man' }, rules.map(r => h('li', null, 'Если ' + r.c.t + ', ' + r.a.t + '.')), h('li', null, 'Иначе — ' + def.t + '.')));
        return h('div', { class: 'stack' },
          h('div', { class: 'ans' }, 'Считайте провода сверху вниз. Правила проверяйте по порядку, первое подходящее и выполняйте.'),
          h('div', { class: 'mangrid' },
            sec('Если на бомбе 4 провода, перережьте:', wr[4].rules, wr[4].def),
            sec('Если на бомбе 5 проводов, перережьте:', wr[5].rules, wr[5].def),
            sec('Если на бомбе 6 проводов, перережьте:', wr[6].rules, wr[6].def),
            api.opts.mods === 2 ? sec('Кнопка:', br.rules, br.def) : null));
      }
      function manualOnly(b) {
        api.show([manualPage(), btn('Всё прочитал — к бомбе', () => play(b), 'big', { 'data-primary': true })], { turn: -1 });
      }
      function play(b) {
        let strikes = 0, wireDone = false, btnDone = b.modules === 1, over = false, tab = 'bomb';
        const rightWire = solveWire(b, wr), rightBtn = b.modules === 2 ? solveBtn(b, br) : null;
        const cut = new Set();
        const timer = Timer(api.opts.time, { onEnd: () => explode('Время вышло'), low: 15 });
        const stage = h('div', { class: 'stack' }), tabs = h('div', { class: 'seg' });
        const secs = () => Math.max(0, Math.ceil(timer.left)) % 60;
        function paint() {
          tabs.replaceChildren(
            h('button', { type: 'button', 'aria-pressed': tab === 'bomb', onclick: () => { tab = 'bomb'; paint(); } }, 'Бомба'),
            h('button', { type: 'button', 'aria-pressed': tab === 'man', onclick: () => { tab = 'man'; paint(); } }, 'Инструкция'));
          if (tab === 'man') { stage.replaceChildren(manualPage()); return; }
          const wires = b.wires.map((w, i) => h('button', {
            type: 'button', class: 'wire' + (cut.has(i) ? ' cut' : ''), disabled: over || wireDone || cut.has(i), 'aria-label': 'Провод ' + (i + 1) + ', ' + w.n,
            onclick: () => pull(i)
          }, h('span', { class: 'wn' }, i + 1), h('span', { class: 'wl', style: { background: w.hex } })));
          const bt = b.modules === 2 ? h('div', { class: 'bmod' }, h('div', { class: 'kicker' }, 'Кнопка'),
            h('button', { type: 'button', class: 'bigbtn', disabled: over || btnDone, style: { background: b.btn.col.hex, color: b.btn.col.id === 'white' || b.btn.col.id === 'yellow' ? '#111' : '#fff' }, onclick: pressBtn }, b.btn.label)) : null;
          stage.replaceChildren(
            h('div', { class: 'bombface' },
              h('div', { class: 'binfo' }, h('div', null, h('span', { class: 'kicker' }, 'Серийный номер'), h('b', { class: 'serial' }, b.serial)),
                h('div', null, h('span', { class: 'kicker' }, 'Батарейки'), h('b', null, b.bat ? '🔋'.repeat(b.bat) : 'нет')),
                h('div', null, h('span', { class: 'kicker' }, 'Индикатор'), h('b', null, b.lit ? '💡 горит' : '⚫ не горит'))),
              h('div', { class: 'bmod' }, h('div', { class: 'kicker' }, 'Провода' + (wireDone ? ' · готово' : '')), h('div', { class: 'wires' }, wires)),
              bt, btnDone && b.modules === 2 ? h('div', { class: 'okline' }, 'Кнопка: готово') : null));
        }
        function strike(msg) {
          strikes++; sfx.bad();
          if (strikes >= 2) return explode('Второй промах');
          stage.classList.add('shake'); setTimeout(() => stage.classList.remove('shake'), 500);
          info.textContent = 'Промах! ' + msg + ' Остался один шанс.'; hearts();
        }
        function pull(i) {
          if (over || wireDone) return;
          cut.add(i);
          if (i === rightWire) { wireDone = true; sfx.ok(); info.textContent = 'Провод перерезан верно.'; check(); } else { strike('Не тот провод.'); }
          paint();
        }
        function pressBtn() {
          if (over || btnDone) return;
          const need = rightBtn;
          if (need == null || secs().toString().includes(String(need))) { btnDone = true; sfx.ok(); info.textContent = 'Кнопка нажата вовремя.'; check(); }
          else strike('Нажали не вовремя.');
          paint();
        }
        function check() { if (wireDone && btnDone) defused(); }
        const info = h('div', { class: 'ans' }, 'Читайте приметы бомбы и инструкцию.'), hr = h('div', { class: 'hearts' });
        function hearts() { hr.textContent = '❤️'.repeat(2 - strikes) + '🖤'.repeat(strikes); }
        function defused() {
          if (over) return; over = true; timer.stop(); ok++; sfx.win();
          api.show(h('div', { class: 'cover' }, h('div', { class: 'big' }, 'Бомба обезврежена'), h('p', { class: 'mid-t' }, 'Осталось времени: ' + fmtTime(Math.round(timer.left)) + '. Промахов: ' + strikes + '.'), btn(n >= total ? 'Итоги' : 'К следующей бомбе', next, 'big', { 'data-primary': true })), { turn: -1, mid: true });
        }
        function explode(why) {
          if (over) return; over = true; timer.stop(); boom++; sfx.boom();
          const wi = 'Нужно было перерезать провод ' + (rightWire + 1) + ' (' + b.wires[rightWire].n + ')' + (rightBtn != null ? '; кнопку нажимать при цифре ' + rightBtn + '.' : b.modules === 2 ? '; кнопку нажимать сразу.' : '.');
          api.show(h('div', { class: 'cover boom shake' }, h('div', { class: 'bomb-big' }, '💥'), h('div', { class: 'big' }, why), h('p', { class: 'mid-t' }, wi), btn(n >= total ? 'Итоги' : 'Следующая бомба', next, 'big', { 'data-primary': true })), { turn: -1, mid: true });
        }
        api.show([h('div', { class: 'row' }, timer.el, hr), tabs, info, stage], { turn: -1 });
        hearts(); paint(); timer.start();
        onLeave(() => { over = true; });
      }
      function end() {
        const win = ok * 2 >= total;
        api.end({ win, custom: true, title: win ? 'Город спасён!' : 'Бомбы взяли своё', sub: 'Обезврежено ' + ok + ' из ' + total + '.', lines: [boom ? 'Взрывов: ' + boom + '.' : 'Ни одного взрыва!', 'Следующая игра будет с другой инструкцией и другими бомбами.'] });
      }
    }
  });
}

boot();
</script>
