:root{
  --felt:#1b2559; --felt-2:#232f6e; --felt-3:#2d3a85;
  --ink:#0e1233; --paper:#eef1ff; --paper-2:#d9dffa; --muted:#9aa6e0;
  --coral:#ff6b57; --sun:#ffc233; --mint:#2fd6a0; --sky:#3aa0ff;
  --grape:#9a6bff; --pink:#ff7ab8; --lime:#b6e24b; --teal:#19c2c9;
  --accent:var(--sun);
  --display:"Bahnschrift","Arial Narrow","Roboto Condensed","DejaVu Sans Condensed","Liberation Sans Narrow",system-ui,sans-serif;
  --body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue","Liberation Sans",sans-serif;
  --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--felt);
  background-image:
    radial-gradient(1200px 600px at 15% -10%,rgba(122,140,255,.22),transparent 60%),
    radial-gradient(900px 500px at 100% 110%,rgba(255,107,87,.12),transparent 60%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 6px);
  background-attachment:fixed;
  color:var(--paper);
  font:400 clamp(16px,1.35vw + 9px,21px)/1.45 var(--body);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.02;margin:0;letter-spacing:.005em}
p{margin:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:10px}
.sr{position:absolute;left:-9999px}

/* ---------- кнопки ---------- */
.btn{
  --bg:var(--sun);
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  background:var(--bg);color:var(--ink);
  border:3px solid var(--ink);border-radius:16px;
  padding:.62em 1.15em;font-weight:800;cursor:pointer;
  box-shadow:0 5px 0 var(--ink);
  transition:transform .08s,box-shadow .08s,filter .15s;
  text-align:center;line-height:1.15;user-select:none;
}
.btn:hover{filter:brightness(1.07)}
.btn:active,.btn.pressed{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.big{font-size:1.25em;padding:.7em 1.5em;border-radius:20px}
.btn.huge{font-size:1.6em;padding:.75em 1.7em;border-radius:24px}
.btn.ghost{--bg:transparent;color:var(--paper);border-color:rgba(238,241,255,.35);box-shadow:none}
.btn.ghost:active{transform:none}
.btn.good{--bg:var(--mint)} .btn.bad{--bg:var(--coral)}
.btn.sky{--bg:var(--sky)} .btn.paper{--bg:var(--paper)}
.btn.small{font-size:.8em;padding:.45em .8em;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn.icon{padding:.45em .7em;font-size:.95em}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:1rem}
.grow{flex:1}

/* ---------- каталог ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:clamp(18px,3vw,40px)}
.hero{display:flex;flex-wrap:wrap;gap:1.2rem 3rem;align-items:flex-end;justify-content:space-between;margin-bottom:clamp(18px,3vw,36px)}
.hero h1{font-size:clamp(56px,10vw,132px);color:var(--paper);letter-spacing:-.01em}
.hero p{max-width:34ch;color:var(--muted);font-size:1.05em}
.hero .top{display:flex;gap:.6rem;align-items:center;margin-bottom:.8rem}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:clamp(16px,2.5vw,28px)}
.chipbtn{
  border:2px solid rgba(238,241,255,.28);background:transparent;color:var(--paper);
  border-radius:999px;padding:.35em 1em;cursor:pointer;font-weight:700;
}
.chipbtn[aria-pressed=true]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,265px),1fr));gap:clamp(16px,2vw,28px)}
.gcard{
  --c:var(--sun);
  position:relative;display:flex;flex-direction:column;text-align:left;cursor:pointer;
  background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:24px;overflow:hidden;
  padding:0;box-shadow:7px 8px 0 rgba(8,10,34,.75);
  transform:rotate(var(--rot,0deg));transition:transform .15s,box-shadow .15s;
}
.gcard:hover{transform:rotate(0) translateY(-4px);box-shadow:7px 13px 0 rgba(8,10,34,.75)}
.gcard:active{transform:translateY(2px);box-shadow:4px 4px 0 rgba(8,10,34,.75)}
.gcard .art{background:var(--c);border-bottom:3px solid var(--ink);display:grid;place-items:center;height:118px;font-size:64px;line-height:1}
.gcard .body{padding:.9rem 1.05rem 1.1rem;display:flex;flex-direction:column;gap:.35rem;flex:1}
.gcard h3{font-size:1.55em}
.gcard .tag{font-size:.88em;color:#3a4170;flex:1}
.gcard .meta{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.35rem}
.pill{background:var(--paper-2);border:2px solid var(--ink);border-radius:999px;padding:.05em .7em;font-size:.78em;font-weight:700}
.foot{margin-top:clamp(28px,4vw,56px);display:flex;gap:1rem 2rem;flex-wrap:wrap;color:var(--muted);align-items:center;font-size:.9em}

/* ---------- экран игры: вступление ---------- */
.intro{display:grid;gap:clamp(18px,3vw,36px);grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
@media(max-width:880px){.intro{grid-template-columns:1fr}}
.panel{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:var(--r);padding:clamp(16px,2vw,28px);box-shadow:7px 8px 0 rgba(8,10,34,.75)}
.panel h2{font-size:1.5em;margin-bottom:.5rem}
.panel.dark{background:var(--felt-2);color:var(--paper)}
.rules{display:flex;flex-direction:column;gap:.55rem}
.rules li{margin-left:1.1em}
.rules ul,.rules ol{margin:0;padding-left:.2em;display:flex;flex-direction:column;gap:.45rem}
.title-row{display:flex;gap:1rem;align-items:center;margin-bottom:1rem}
.title-row .ic{width:88px;height:88px;flex:none;display:grid;place-items:center;font-size:52px;background:var(--accent);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink)}
.title-row h1{font-size:clamp(40px,6vw,76px)}
.stepper{display:flex;align-items:center;gap:.8rem}
.stepper b{font-family:var(--display);font-size:2.2em;min-width:1.4em;text-align:center}
.teamrow{display:flex;gap:.6rem;align-items:center;margin:.4rem 0}
.dot{width:1.3em;height:1.3em;border-radius:50%;border:3px solid var(--ink);background:var(--c);flex:none}
.input{width:100%;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:.5em .8em;font-weight:700}
.seg{display:flex;gap:.4rem;flex-wrap:wrap}
.seg button{border:3px solid var(--ink);background:var(--paper-2);color:var(--ink);border-radius:12px;padding:.3em .85em;font-weight:800;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--sun);color:var(--ink);box-shadow:0 3px 0 var(--ink);transform:translateY(-2px)}
.label{font-weight:800;margin:.9rem 0 .35rem}

/* ---------- рамка игры ---------- */
.frame{min-height:100vh;display:flex;flex-direction:column}
.bar{display:flex;gap:.7rem;align-items:center;padding:.7rem clamp(12px,2vw,28px);background:rgba(14,18,51,.55);border-bottom:3px solid var(--ink);backdrop-filter:blur(4px)}
.bar-title{font-family:var(--display);font-weight:800;font-size:1.35em;flex:1;display:flex;align-items:center;gap:.5rem}
.bar-title i{font-style:normal;display:grid;place-items:center;width:1.8em;height:1.8em;background:var(--accent);border:2px solid var(--ink);border-radius:10px;font-size:.95em}
.board{display:flex;gap:.55rem;flex-wrap:wrap;padding:.8rem clamp(12px,2vw,28px) 0}
.tchip{
  --c:var(--sun);display:flex;align-items:center;gap:.6rem;background:var(--c);color:var(--ink);
  border:3px solid var(--ink);border-radius:14px;padding:.25em .8em .25em .45em;font-weight:800;
  box-shadow:0 3px 0 var(--ink);opacity:.72;transition:transform .15s,opacity .15s
}
.tchip.on{opacity:1;transform:translateY(-3px);box-shadow:0 7px 0 var(--ink)}
.tchip .sc{font-family:var(--display);font-size:1.45em;background:var(--ink);color:var(--paper);border-radius:9px;padding:0 .45em;min-width:1.6em;text-align:center}
.tchip.bump .sc{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.5)}}
.stage{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:clamp(14px,2.2vw,32px);display:flex;flex-direction:column;gap:clamp(14px,2vw,26px)}
.stage.mid{justify-content:center}

/* ---------- карточка на столе ---------- */
.card{
  background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:26px;
  padding:clamp(18px,3vw,44px);box-shadow:9px 10px 0 rgba(8,10,34,.75);
  display:flex;flex-direction:column;gap:1rem;position:relative
}
.card.accent{background:var(--accent)}
.card .kicker{font-weight:800;color:#4a5190;font-size:.95em}
.card.accent .kicker{color:rgba(14,18,51,.7)}
.big{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.6vw,60px);line-height:1.08}
.mid-t{font-size:clamp(20px,2.4vw,30px);font-weight:700;line-height:1.3}
.emoji-big{font-size:clamp(56px,11vw,132px);line-height:1.1;letter-spacing:.06em;word-break:keep-all}
.center{text-align:center;align-items:center}
.muted{color:var(--muted)}
.card .muted{color:#5a619a}
.hint{font-size:.9em;color:#4a5190}
.ans{background:var(--ink);color:var(--paper);border-radius:18px;padding:.9rem 1.2rem;font-weight:800}
.ans .big{color:var(--sun)}

/* варианты ответов */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:.9rem}
.opt{
  border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:18px;padding:.85em 1.1em;
  font-weight:800;text-align:left;cursor:pointer;box-shadow:0 5px 0 var(--ink);display:flex;gap:.8rem;align-items:center;
  transition:transform .08s,box-shadow .08s,background .15s
}
.opt:hover{background:var(--paper-2)}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.opt b{font-family:var(--display);display:grid;place-items:center;width:1.9em;height:1.9em;flex:none;background:var(--ink);color:var(--paper);border-radius:10px}
.opt.right{background:var(--mint)} .opt.wrong{background:var(--coral)} .opt.dim{opacity:.45}
.opt.picked{outline:4px solid var(--sky)}

/* таймер */
.timer{display:flex;align-items:center;gap:1rem;min-width:min(100%,340px)}
.timer .tbar{flex:1;height:18px;border:3px solid var(--ink);border-radius:999px;background:var(--paper-2);overflow:hidden}
.timer .tbar i{display:block;height:100%;background:var(--mint);transform-origin:left;transition:transform .12s linear,background .2s}
.timer .tnum{font-family:var(--display);font-weight:800;font-size:2.2em;min-width:2.3ch;text-align:right}
.timer.low .tbar i{background:var(--coral)} .timer.low .tnum{color:var(--coral);animation:pulse .5s infinite alternate}
.dark .timer .tnum,.stage>.timer .tnum{color:var(--paper)}
.timer.low .tnum{color:var(--coral)!important}
@keyframes pulse{to{transform:scale(1.12)}}

/* выбор команды */
.picks{display:flex;gap:.7rem;flex-wrap:wrap}
.pick{--c:var(--sun)}
.pick.btn{--bg:var(--c)}

/* модалка */
.veil{position:fixed;inset:0;background:rgba(8,10,34,.72);display:grid;place-items:center;padding:20px;z-index:50}
.veil .panel{max-width:640px;width:100%;max-height:90vh;overflow:auto}
.veil .row{margin-top:1.1rem}

/* итоги */
.podium{display:flex;flex-direction:column;gap:.7rem;max-width:760px;width:100%;margin:0 auto}
.prow{--c:var(--sun);display:flex;align-items:center;gap:1rem;background:var(--c);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:.5em 1em;box-shadow:0 5px 0 var(--ink);font-weight:800;font-size:1.25em}
.prow .pl{font-family:var(--display);font-size:1.6em;width:1.4em;text-align:center}
.prow .pn{flex:1}
.prow .ps{font-family:var(--display);font-size:1.7em;background:var(--ink);color:var(--paper);border-radius:12px;padding:0 .6em}
.prow.first{transform:scale(1.04);animation:pop .6s both}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1.04);opacity:1}}
.conf{position:fixed;top:-20px;width:10px;height:16px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}

/* разное */
.tag{display:inline-block}
.list{display:flex;flex-direction:column;gap:.45rem}
.kv{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap}
.badge{display:inline-block;background:var(--ink);color:var(--paper);border-radius:10px;padding:.05em .6em;font-weight:800;font-size:.85em}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.flash{animation:flash .6s}
@keyframes flash{0%{background:var(--coral)}}
.hidden{display:none!important}
.cover{background:var(--ink);color:var(--paper);border-radius:22px;padding:clamp(18px,3vw,40px);text-align:center;display:flex;flex-direction:column;gap:1rem;align-items:center;justify-content:center;min-height:260px;border:3px dashed rgba(238,241,255,.35)}
.cover .big{color:var(--sun)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* стили отдельных игр */
.tile{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:.7rem .9rem .9rem;display:flex;flex-direction:column;gap:.55rem;box-shadow:0 5px 0 var(--ink)}
.tile h3{font-size:1.2em;display:flex;gap:.5rem;align-items:center}
.tile h3 span{font-size:1.3em}
.tile .lv{display:flex;gap:.4rem;flex-wrap:wrap}

/* дилеммы */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:stretch}
.vsopt{border:3px solid var(--ink);border-radius:22px;padding:1.1rem 1.3rem;font-family:var(--display);font-weight:800;font-size:clamp(22px,3vw,40px);line-height:1.1;box-shadow:0 7px 0 var(--ink);display:flex;flex-direction:column;gap:.7rem;color:var(--ink);text-align:left;cursor:default;transition:transform .08s,opacity .2s}
button.vsopt{cursor:pointer}
button.vsopt:hover{transform:translateY(-3px)}
button.vsopt:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.vsopt.a{background:var(--sun)} .vsopt.b{background:var(--sky)}
.vsopt b{display:grid;place-items:center;width:1.5em;height:1.5em;background:var(--ink);color:var(--paper);border-radius:10px;font-size:.8em}
.vsopt.dim{opacity:.35} .vsopt.sel{outline:5px solid var(--paper);outline-offset:3px}
.vs-or{align-self:center;font-weight:800;color:var(--muted)}
@media(max-width:760px){.vs{grid-template-columns:1fr}.vs-or{display:none}}
.bombbox{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0}
.bomb{font-size:clamp(70px,14vh,130px);line-height:1;transition:transform .1s}
.bomb.pulse{animation:bpulse .35s}
@keyframes bpulse{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-4deg)}100%{transform:scale(1)}}
.bomb-big{font-size:clamp(90px,20vh,170px);line-height:1}
.cover.boom{background:radial-gradient(circle at 50% 30%,#ff6b57 0,#8a1f13 70%);border-radius:24px;padding:28px}
@media (prefers-reduced-motion:reduce){.bomb.pulse{animation:none}}
.suspgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.7rem}
.susp{display:flex;flex-direction:column;gap:2px;text-align:left;padding:.7rem .85rem;border-radius:16px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:inherit;font:inherit;cursor:pointer}
.susp b{font-size:1.1em}.susp i{opacity:.7;font-style:normal;margin-bottom:4px}
.susp .lock{opacity:.5}.susp .open{color:var(--sun,#ffc233)}
.susp:hover,.susp:focus-visible{border-color:var(--sun,#ffc233)}
.susp.out{opacity:.35;text-decoration:line-through}
.notes{margin:.3rem 0 0;padding-left:1.2rem;display:grid;gap:.25rem}
.cipher{font-family:var(--display);font-size:clamp(28px,5vw,60px);letter-spacing:.12em;margin:.4rem 0;word-break:break-word}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1rem;margin:.3rem 0}
.legend b{color:var(--sun,#ffc233)}
.codes{display:grid;gap:.35rem;margin-top:.5rem;font-size:1.15em}
.codes b{font-family:var(--display);letter-spacing:.2em;color:var(--sun,#ffc233);margin-right:.3rem}
.story{line-height:1.55}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:.6rem .9rem;border-radius:16px;border-left:8px solid var(--c);background:rgba(255,255,255,.07)}
.vrow b{font-size:1.2em}
.big.vgood{color:var(--mint,#2fd6a0)}.big.vbad{color:var(--coral,#ff6b57)}
.mangrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:.8rem}
.man{margin:.4rem 0 0;padding-left:1.4rem;display:grid;gap:.4rem;line-height:1.35}
.bombface{display:grid;gap:1rem;padding:1rem;border-radius:22px;background:#252b3d;border:3px solid rgba(255,255,255,.2)}
.binfo{display:flex;flex-wrap:wrap;gap:.6rem 2rem}.binfo b{display:block;font-size:1.3em}
.serial{font-family:var(--display);letter-spacing:.18em}
.wires{display:grid;gap:.5rem}
.wire{display:flex;align-items:center;gap:.8rem;border:0;background:transparent;padding:.15rem 0;cursor:pointer;color:inherit;font:inherit}
.wire .wn{width:1.6em;opacity:.7;text-align:right}
.wire .wl{flex:1;height:18px;border-radius:9px;border:2px solid rgba(255,255,255,.65);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.wire:hover:not(:disabled) .wl,.wire:focus-visible .wl{transform:scaleY(1.35)}
.wire.cut .wl{opacity:.25;border-style:dashed}
.bigbtn{width:min(240px,60%);aspect-ratio:2/1;border-radius:999px;border:4px solid rgba(255,255,255,.7);font:inherit;font-weight:800;font-size:1.5rem;cursor:pointer}
.bigbtn:disabled{opacity:.4}
.okline{color:var(--mint,#2fd6a0);font-weight:700}
.hearts{font-size:1.6rem}
.row .input{flex:1;min-width:220px;width:auto}
.avatar{height:clamp(130px,11vw,190px);display:flex;align-items:flex-end;justify-content:center;margin-bottom:.35rem}
.avatar svg{height:100%;width:auto;overflow:visible}

/* ===================== Визуальный слой v2 ===================== */
:root{
  --display:"IgroDisplay","Bahnschrift","Arial Narrow",system-ui,sans-serif;
  --body:"IgroText","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --shadow-hard:rgba(8,10,34,.78);
}
body{font:500 clamp(16px,.72vw + 11px,30px)/1.45 var(--body);font-feature-settings:"kern","calt";letter-spacing:-.003em}
h1,h2,h3,.big,.bar-title,.stepper b,.tchip .sc,.timer .tnum,.cipher{font-family:var(--display);font-weight:900;letter-spacing:-.012em}
.big{font-size:clamp(28px,4.2vw,78px);line-height:1.04}
.mid-t{font-size:clamp(20px,2.1vw,40px);font-weight:700;line-height:1.28}
.btn,.opt,.chipbtn,.pill,.kicker{font-family:var(--body);font-weight:800}

/* --- комната игры: фон окрашен цветом игры --- */
.room{position:relative;isolation:isolate}
.room::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(1100px 620px at 88% -12%,color-mix(in srgb,var(--accent) 38%,transparent),transparent 64%),
    radial-gradient(900px 560px at -6% 108%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 62%)}
.motif{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.motif span{position:absolute;font-size:clamp(90px,13vw,240px);opacity:.075;filter:saturate(.6) blur(.4px);transform:rotate(var(--r,-12deg))}
.motif span:nth-child(1){left:-2%;top:62%;--r:-14deg}
.motif span:nth-child(2){right:3%;top:10%;--r:12deg;font-size:clamp(120px,17vw,320px)}
.motif span:nth-child(3){left:24%;top:78%;--r:8deg}
.motif span:nth-child(4){right:30%;top:58%;--r:-6deg;font-size:clamp(70px,9vw,170px)}
.motif span:nth-child(5){left:40%;top:-3%;--r:18deg}
.motif span:nth-child(6){right:-2%;top:76%;--r:-18deg}

/* --- наклейки-иллюстрации --- */
.stk{--tone:#fff;--s:168px;position:relative;flex:none;width:var(--s);height:var(--s);display:grid;place-items:center;
  border:3px solid var(--ink);border-radius:30%;
  background:radial-gradient(circle at 30% 22%,#fff 0,color-mix(in srgb,var(--tone) 55%,#fff) 46%,color-mix(in srgb,var(--tone) 88%,#9aa6e0) 100%);
  box-shadow:0 7px 0 var(--ink),inset 0 -10px 22px rgba(14,18,51,.1);
  transform:rotate(var(--tilt,0deg));animation:stk-pop .5s cubic-bezier(.2,1.5,.4,1) both;user-select:none}
.stk-main{font-size:calc(var(--s)*.58);line-height:1;filter:drop-shadow(0 4px 0 rgba(14,18,51,.18))}
.stk-sub{position:absolute;display:grid;place-items:center;width:34%;height:34%;font-size:calc(var(--s)*.21);line-height:1;
  background:#fff;border:3px solid var(--ink);border-radius:50%;box-shadow:0 3px 0 var(--ink)}
.stk-sub.s1{right:-9%;bottom:-8%;transform:rotate(8deg)}
.stk-sub.s2{left:-9%;top:-8%;transform:rotate(-10deg)}
.stk-s{--s:56px;border-width:2px;border-radius:26%;box-shadow:0 4px 0 var(--ink)}.stk-s .stk-sub{display:none}
.stk-m{--s:88px}.stk-m .stk-sub{border-width:2px}
.stk-l{--s:128px}.stk-xl{--s:clamp(120px,15vw,240px)}
@keyframes stk-pop{from{opacity:0;transform:rotate(calc(var(--tilt,0deg) - 14deg)) scale(.55)}to{opacity:1}}

/* карточка с иллюстрацией слева */
.card.withpic{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(18px,2.6vw,48px);align-items:center}
.card.withpic>.qbody{display:flex;flex-direction:column;gap:1rem;min-width:0}
@media(max-width:700px){.card.withpic{grid-template-columns:1fr;justify-items:center;text-align:center}.card.withpic>.qbody{align-items:center}}
.card.accent{background:radial-gradient(circle at 105% -10%,rgba(255,255,255,.34),transparent 52%),var(--accent)}
.card{box-shadow:9px 10px 0 var(--shadow-hard),0 28px 50px -22px rgba(0,0,0,.5)}
.card.center .stk{margin-bottom:.4rem}

/* появление экрана: один согласованный жест при смене хода */
.stage>*{animation:rise .32s cubic-bezier(.2,.9,.3,1) both}
.stage>*:nth-child(2){animation-delay:.05s}.stage>*:nth-child(3){animation-delay:.1s}.stage>*:nth-child(4){animation-delay:.15s}.stage>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* --- каталог --- */
.hero h1{font-size:clamp(64px,11vw,190px);line-height:.9;letter-spacing:-.035em;
  background:linear-gradient(180deg,#fff 20%,#aebaff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(8,10,34,.55))}
.gcard{box-shadow:7px 8px 0 var(--shadow-hard)}
.gcard .art{position:relative;height:clamp(130px,11vw,190px);overflow:hidden;font-size:0;
  background:radial-gradient(circle at 24% 18%,rgba(255,255,255,.55),transparent 55%),repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 10px,transparent 10px 22px),var(--c)}
.gcard .art span{position:absolute;line-height:1;filter:drop-shadow(0 4px 0 rgba(14,18,51,.22));transition:transform .25s cubic-bezier(.2,1.4,.4,1)}
.gcard .art .a1{font-size:clamp(64px,5.8vw,100px);left:50%;top:50%;transform:translate(-50%,-50%) rotate(-4deg)}
.gcard .art .a2{font-size:clamp(30px,2.8vw,50px);left:11%;top:14%;transform:rotate(-14deg)}
.gcard .art .a3{font-size:clamp(30px,2.8vw,50px);right:11%;bottom:12%;transform:rotate(12deg)}
.gcard:hover .art .a1{transform:translate(-50%,-54%) rotate(3deg) scale(1.08)}
.gcard:hover .art .a2{transform:rotate(-24deg) translate(-4px,-4px)}
.gcard:hover .art .a3{transform:rotate(22deg) translate(4px,4px)}
.gcard h3{font-size:1.5em;letter-spacing:-.015em}
.gcard .tag{color:#394072;font-weight:500}

/* --- вступление --- */
.title-row .stk{--s:clamp(96px,9vw,150px)}
.title-row h1{font-size:clamp(40px,5.6vw,104px);letter-spacing:-.025em;line-height:.98}
.panel{box-shadow:7px 8px 0 var(--shadow-hard)}
.seg button{font-family:var(--body);font-weight:800}

/* --- дилеммы: варианты с картинками --- */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(10px,2vw,28px);align-items:stretch}
@media(max-width:760px){.vs{grid-template-columns:1fr}}
.vsopt{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1rem;text-align:center;
  padding:clamp(16px,2.4vw,34px) clamp(14px,2vw,28px);position:relative;font:inherit;border-width:3px}
.vsopt b{position:absolute;left:.8rem;top:.8rem;display:grid;place-items:center;width:2em;height:2em;background:var(--ink);color:var(--paper);border-radius:12px;font-family:var(--display)}
.vsopt .vt{font-family:var(--display);font-weight:900;font-size:clamp(22px,2.6vw,48px);line-height:1.1;letter-spacing:-.01em}
.vsopt .stk{--s:clamp(110px,12vw,200px)}
.vs-or{align-self:center;font-family:var(--display);font-weight:900;background:var(--ink);color:var(--paper);padding:.5em .7em;border-radius:999px;border:3px solid var(--paper-2)}
.vsopt.dim{opacity:.4;filter:saturate(.5)}

/* --- мелочи --- */
.opt{font-size:1em;transition:transform .08s,box-shadow .08s,background .15s}
.opt:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.bar{background:rgba(14,18,51,.62)}
.cover{background:linear-gradient(180deg,rgba(14,18,51,.92),rgba(14,18,51,.82))}
.cipher{letter-spacing:.1em}
.susp{position:relative}
@media (prefers-reduced-motion:reduce){.stage>*,.stk{animation:none}.gcard .art span{transition:none}}

/* --- телефон: верхняя панель не должна вылезать за экран --- */
@media(max-width:560px){
  .bar{gap:8px;padding:8px 10px;flex-wrap:nowrap;min-width:0}
  .bar>*{min-width:0}
  .bar .btn{padding:.45em .65em;font-size:.85em}
  .bar .bar-title{font-size:1.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
  .bar .spacer{display:none}
  html,body{overflow-x:hidden}
}

/* --- иконки интерфейса (одна семья, штрих 2px) --- */
.ico{display:inline-grid;place-items:center;width:1.25em;height:1.25em;flex:none}
.ico svg{width:100%;height:100%;display:block}
.btn:has(>.ico+*){gap:.45em}
.btn.icon{min-width:2.6em;min-height:2.6em;display:inline-grid;place-items:center}
.btn.icon .ico{width:1.35em;height:1.35em}
.btn.ghost.small,.btn.ghost.icon{min-height:2.6em}
.susp .avatar{height:clamp(120px,10vw,170px)}

/* --- иллюстрации Icons8 (Bouncy) --- */
.ill{display:grid;place-items:center}
.ill svg{width:100%;height:100%;display:block;overflow:visible}
.gcard .art.has-ill{display:grid;place-items:center}
.gcard .art.has-ill .ill{width:58%;height:84%;filter:drop-shadow(0 6px 0 rgba(14,18,51,.22));transition:transform .25s cubic-bezier(.2,1.4,.4,1)}
.gcard:hover .art.has-ill .ill{transform:rotate(-5deg) scale(1.07)}
.ill-badge{flex:none;width:clamp(110px,10vw,170px);aspect-ratio:1;padding:14px;border:3px solid var(--ink);border-radius:30%;box-shadow:0 7px 0 var(--ink);
  background:radial-gradient(circle at 30% 22%,#fff 0,color-mix(in srgb,var(--c) 40%,#fff) 100%);animation:stk-pop .5s cubic-bezier(.2,1.5,.4,1) both}
.ill-badge .ill{width:100%;height:100%}
.hero-main{display:flex;align-items:center;gap:clamp(16px,3vw,48px)}
.hero-ill{flex:none;width:clamp(96px,12vw,200px);aspect-ratio:1;filter:drop-shadow(0 8px 0 rgba(8,10,34,.5));animation:stk-pop .6s cubic-bezier(.2,1.5,.4,1) both}
@media(max-width:560px){.hero-ill{display:none}}
@media(prefers-reduced-motion:reduce){.hero-ill,.ill-badge{animation:none}}
.gcard .art.has-ill{display:block}
.gcard .art.has-ill .ill{position:absolute;inset:12% 18%;width:auto;height:auto}
.hero-ill{padding:12px;border:3px solid var(--ink);border-radius:30%;box-shadow:0 7px 0 var(--ink);background:radial-gradient(circle at 30% 22%,#fff,#cfd8ff);filter:none}
.ill{position:relative}
.ill svg{position:absolute;inset:0;width:100%;height:100%}
.gcard .art.has-ill .ill{position:absolute}
.ill-badge .ill{aspect-ratio:1}

/* --- баннер хода: всегда видно, кто сейчас отвечает --- */
.turnbar{display:flex;align-items:center;gap:clamp(12px,1.6vw,24px);margin:0 auto clamp(10px,1.4vw,20px);width:min(100% - 32px,1180px);
  padding:clamp(10px,1.2vw,18px) clamp(14px,2vw,28px);border:3px solid var(--ink);border-radius:22px;
  background:linear-gradient(100deg,var(--c) 0,color-mix(in srgb,var(--c) 72%,#fff) 100%);color:var(--ink);box-shadow:0 6px 0 var(--ink)}
.turnbar.off{display:none}
.turnbar .tb-ico{display:grid;place-items:center;flex:none;width:2.6em;height:2.6em;border-radius:50%;background:var(--ink);color:#fff;border:3px solid #fff}

<body>
<div id="app"></div>
<noscript>Для игр нужен включённый JavaScript.</noscript>
<script>
'use strict';
/* ===================== Игротека: движок ===================== */
const DATA = {};
const G = { games: [] };

/* ---------- утилиты ---------- */
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const sample = (a, k) => shuffle(a).slice(0, k);
const range = n => Array.from({ length: n }, (_, i) => i);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const fmtTime = s => { s = Math.max(0, Math.ceil(s)); return s >= 60 ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : String(s); };
const plural = (n, a, b, c) => { const m = Math.abs(n) % 100, d = m % 10; return (m > 10 && m < 20) ? c : d === 1 ? a : (d >= 2 && d <= 4) ? b : c; };

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') { for (const s in v) s.startsWith('--') ? el.style.setProperty(s, v[s]) : (el.style[s] = v[s]); }

    else el.setAttribute(k, v === true ? (k.startsWith('aria-') ? 'true' : '') : v);
  }
  for (const kid of kids.flat(Infinity)) { if (kid == null || kid === false) continue; el.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
  return el;
}

/* ---------- хранилище ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('igroteka.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('igroteka.' + k, JSON.stringify(v)); } catch (e) { } },
  clearSeen() { try { Object.keys(localStorage).filter(k => k.startsWith('igroteka.seen.')).forEach(k => localStorage.removeItem(k)); } catch (e) { } }
};

/* ---------- колоды без повторов, темы вечера, скрытые карточки ---------- */
const PACKS = [['all', 'Обычный вечер', '🎲'], ['ny', 'Новый год', '🎄'], ['bday', 'День рождения', '🎂'], ['kids', 'Для детей', '🧸'], ['corp', 'Корпоратив', '💼'], ['friends', 'Для друзей', '🍻']];
const curPack = () => store.get('pack', 'all');
let LAST = null, pendingDecks = [];
const itemKey = it => typeof it === 'string' ? it : JSON.stringify(it);
function describeItem(it) { if (it && typeof it === 'object' && !Array.isArray(it) && typeof it.q === 'string') return it.q + (Array.isArray(it.a) ? ' → ' + it.a[0] : typeof it.a === 'string' ? ' → ' + it.a : ''); if (it && it.fake) return it.topic + ': ' + it.fake; if (it && it.w) return it.w + (it.m ? ' = ' + it.m : '');
  const o = []; (function w(v) { if (v == null) return; if (Array.isArray(v)) v.forEach(w); else if (typeof v === 'object') Object.values(v).forEach(w); else o.push(String(v)); })(it); return o.join(' · '); }
function makeDeck(name, base) {
  const key = 'seen.' + name, bkey = 'bad.' + name; pendingDecks.push(name);
  const themed = (DATA.themed && DATA.themed[name]) || {};
  const items = base.slice(), tags = base.map(() => null);
  for (const p in themed) themed[p].forEach(it => { items.push(it); tags.push(p); });
  const ok = (i, flt, P, bad) => (!flt || flt(items[i])) && (P === 'all' ? !tags[i] : P === 'kids' ? tags[i] === 'kids' : (!tags[i] || tags[i] === P)) && !bad.has(itemKey(items[i]));
  const pool = (flt, P) => { const bad = new Set(store.get(bkey, [])), r = []; items.forEach((it, i) => { if (ok(i, flt, P, bad)) r.push(i); }); return r; };
  const deck = {
    name, items, themed,
    draw(filter) {
      let p = pool(filter, curPack()); if (!p.length) p = pool(filter, 'all'); if (!p.length) p = items.map((_, i) => i).filter(i => !filter || filter(items[i]));
      if (!p.length) return null;
      const seen = new Set(store.get(key, []));
      let fresh = p.filter(i => !seen.has(i));
      if (!fresh.length) { p.forEach(i => seen.delete(i)); fresh = p; }
      const P = curPack(); if (P !== 'all' && P !== 'kids') { const th = fresh.filter(j => tags[j] === P); if (th.length && Math.random() < .7) fresh = th; }
      const i = fresh[rnd(fresh.length)]; seen.add(i); store.set(key, [...seen]); LAST = { deck: name, item: items[i] };
      return items[i];
    },
    drawN(n, filter) { const r = []; for (let i = 0; i < n; i++) { const x = this.draw(filter); if (x != null) r.push(x); } return r; },
    has(filter) { return pool(filter, curPack()).length > 0; },
    count(filter) { return pool(filter, curPack()).length; },
    left(filter) { const seen = new Set(store.get(key, [])); return pool(filter, curPack()).filter(i => !seen.has(i)).length; }
  };
  return deck;
}
function registerGame(def) { def.decks = pendingDecks; pendingDecks = []; G.games.push(def); }

/* ---------- звук ---------- */
const sfx = (() => {
  let ac = null, mute = store.get('mute', false);
  const ctx = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (ac && ac.state === 'suspended') ac.resume(); return ac; };
  const on = () => !mute && Settings.get('sfx');
  function tone(f, d = .12, type = 'sine', vol = .12, delay = 0, slide) {
    if (!on()) return; const a = ctx(); if (!a) return; vol *= Settings.get('vol') * 1.25;
    const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .03);
  }
  function noise(d = .8, vol = .3) {
    if (!on()) return; const a = ctx(); if (!a) return; vol *= Settings.get('vol') * 1.25;
    const len = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, len, a.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const s = a.createBufferSource(), g = a.createGain(); s.buffer = buf; g.gain.value = vol; s.connect(g); g.connect(a.destination); s.start();
  }
  return {
    get muted() { return mute; }, ctx, toggle() { mute = !mute; store.set('mute', mute); Music.sync(); if (mute) Music.stop(); else if (G.inSession) Music.start(G.mood); return mute; },
    click() { tone(520, .05, 'square', .04); }, ok() { tone(660, .1, 'triangle', .14); tone(880, .18, 'triangle', .14, .1); },
    bad() { tone(220, .3, 'sawtooth', .1, 0, 110); }, tick() { if (Settings.get('tick')) tone(900, .04, 'square', .05); },
    boom() { noise(1, .4); tone(90, .7, 'sawtooth', .25, 0, 35); }, buzz() { tone(140, .5, 'sawtooth', .12); },
    win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .2, 'triangle', .14, i * .12)); },
    fanfare() { [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, i === 7 ? .6 : .16, 'triangle', .15, i * .13)); tone(262, .9, 'sine', .12, .9); },
    start() { [392, 523, 659].forEach((f, i) => tone(f, .14, 'triangle', .12, i * .09)); },
    streak() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, .12, 'triangle', .13, i * .07)); },
    ding() { tone(1200, .3, 'sine', .12); }
  };
})();

/* ---------- очистка при смене экрана ---------- */
const leaveFns = [];
const onLeave = f => leaveFns.push(f);
function runLeave() { while (leaveFns.length) { try { leaveFns.pop()(); } catch (e) { } } }

/* ---------- таймер ---------- */
function Timer(sec, o = {}) {
  const bar = h('i'), num = h('span', { class: 'tnum' }), el = h('div', { class: 'timer' }, h('div', { class: 'tbar' }, bar), num);
  let total = sec, left = sec, end = 0, id = null, running = false, last = -1;
  function paint() { num.textContent = fmtTime(left); bar.style.transform = 'scaleX(' + (total ? clamp(left / total, 0, 1) : 0) + ')'; el.classList.toggle('low', running && left <= (o.low ?? 5)); }
  function loop() {
    left = Math.max(0, (end - performance.now()) / 1000);
    const s = Math.ceil(left); if (s !== last) { last = s; if (running && s <= (o.low ?? 5) && s > 0 && !o.quiet) sfx.tick(); o.onSecond && o.onSecond(s); }
    paint(); if (left <= 0) { stop(); o.onEnd && o.onEnd(); }
  }
  function start() { if (running) return; end = performance.now() + left * 1000; running = true; id = setInterval(loop, 100); onLeave(stop); paint(); }
  function stop() { running = false; clearInterval(id); el.classList.remove('low'); }
  function reset(s) { stop(); total = s ?? total; left = total; last = -1; paint(); }
  function add(s) { left += s; total = Math.max(total, left); if (running) end += s * 1000; paint(); }
  paint();
  return { el, start, stop, reset, add, get left() { return left; }, get running() { return running; } };
}

/* ---------- UI-кирпичики ---------- */
const TEAM_COLORS = ['#ff6b57', '#3aa0ff', '#2fd6a0', '#ffc233', '#9a6bff', '#ff7ab8', '#19c2c9', '#b6e24b'];
function btn(label, onclick, cls = '', attrs = {}) {
  const b = h('button', { class: 'btn ' + cls, type: 'button', ...attrs }, label);
  b.addEventListener('click', e => { sfx.click(); onclick && onclick(e, b); });
  return b;
}
function modal(content, buttons) {
  const v = h('div', { class: 'veil', role: 'dialog', 'aria-modal': 'true' }, h('div', { class: 'panel' }, content, h('div', { class: 'row' }, buttons)));
  document.body.append(v); const f = v.querySelector('.btn'); f && f.focus();
  return { close() { v.remove(); } };
}
function confirmBox(text, yes, yesLabel = 'Да', noLabel = 'Отмена', no) {
  const m = modal(h('p', { class: 'mid-t' }, text), [btn(yesLabel, () => { m.close(); yes(); }, 'bad'), btn(noLabel, () => { m.close(); no && no(); }, 'paper')]);
}
function confetti(n = 80) {
  const cols = TEAM_COLORS; n = fx.confettiAmount(n);
  for (let i = 0; i < n; i++) {
    const c = h('div', { class: 'conf', style: { left: rnd(100) + 'vw', background: pick(cols), animationDuration: (2 + Math.random() * 2.5) + 's', animationDelay: (Math.random() * .8) + 's', transform: 'rotate(' + rnd(360) + 'deg)' } });
    document.body.append(c); setTimeout(() => c.remove(), 5500);
  }
}
/* «зажмите, чтобы посмотреть» — тайная информация видна, пока держишь кнопку */
function peek(secret, label = 'Нажмите, чтобы посмотреть') {
  const hold = h('button', { class: 'btn big sky', type: 'button', style: { touchAction: 'none' } }, label);
  const body = h('div', { class: 'hidden' }, secret);
  const wrap = h('div', { class: 'stack center', style: { alignItems: 'center' } }, body, hold);
  let shown = false, t0 = 0;
  const show = () => { shown = true; body.classList.remove('hidden'); hold.textContent = 'Нажмите, чтобы спрятать'; };

/* ---------- музыка: короткие зацикленные синтезированные мелодии ---------- */
const Music = (() => {
  const N = (n) => 440 * Math.pow(2, (n - 69) / 12); // MIDI -> Гц
  const MOODS = {
    fun:   { bpm: 116, root: 60, scale: [0, 2, 4, 7, 9], bass: [0, 0, 7, 5], lead: 'triangle', hat: true, name: 'Весёлая' },
    party: { bpm: 126, root: 62, scale: [0, 2, 4, 5, 7, 9], bass: [0, 5, 7, 5], lead: 'square', hat: true, name: 'Вечеринка' },
    calm:  { bpm: 78,  root: 57, scale: [0, 2, 4, 7, 9], bass: [0, 0, 5, 7], lead: 'sine', hat: false, name: 'Спокойная' },
    tense: { bpm: 132, root: 57, scale: [0, 3, 5, 6, 7, 10], bass: [0, 0, 3, 1], lead: 'sawtooth', hat: true, name: 'Напряжённая' }
  };
  let cur = null, timer = null, step = 0, nextT = 0, master = null, noiseBuf = null, melody = [], mood = null, ducked = false;
  const ac = () => sfx.ctx();
  function level() { return sfx.muted || !Settings.get('music') ? 0 : Settings.get('musicVol') * Settings.get('vol') * .16 * (ducked ? .25 : 1); }
  function sync() { if (master) master.gain.setTargetAtTime(level(), ac().currentTime, .08); }
  function voice(f, t, d, type, vol, filt) {
    const a = ac(), o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    let out = g; o.connect(g);
    if (filt) { const bq = a.createBiquadFilter(); bq.type = 'lowpass'; bq.frequency.value = filt; g.connect(bq); out = bq; }
    out.connect(master); o.start(t); o.stop(t + d + .05);
  }
  function hat(t, vol = .35) {
    const a = ac(); if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate * .05, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length); }
    const s = a.createBufferSource(), g = a.createGain(), hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000; s.buffer = noiseBuf; g.gain.value = vol; s.connect(hp); hp.connect(g); g.connect(master); s.start(t);
  }
  function makeMelody(m) { // 2 такта по 8 шагов: случайная, но «правильная» по звукоряду
    const sc = m.scale, len = 16; const out = []; let deg = rnd(sc.length);
    for (let i = 0; i < len; i++) { if (Math.random() < .28 && i % 4 !== 0) { out.push(null); continue; } deg = clamp(deg + pick([-2, -1, -1, 0, 1, 1, 2]), 0, sc.length * 2 - 1); const oct = deg >= sc.length ? 12 : 0; out.push(m.root + 12 + oct + sc[deg % sc.length]); }
    return out;
  }
  function schedule() {
    const a = ac(), m = cur; if (!m) return; const dur = 60 / m.bpm / 2; // восьмая
    while (nextT < a.currentTime + .35) {
      const s = step % 32, bar = Math.floor(s / 8) % 4, beat = s % 8;
      if (s === 0 && step > 0 && Math.random() < .5) melody = makeMelody(m);
      const mel = melody[s % melody.length];
      if (mel && beat % 1 === 0) voice(N(mel), nextT, dur * 1.6, m.lead, m.lead === 'sine' ? .5 : .22, 2600);
      if (beat === 0 || (beat === 4 && m !== MOODS.calm)) voice(N(m.root - 24 + m.bass[bar]), nextT, dur * 3, 'sine', .9);
      if (m.hat && beat % 2 === 1) hat(nextT, .3);
      if (m === MOODS.calm && beat === 0) { [0, 2, 4].forEach(k => voice(N(m.root - 12 + m.scale[k]), nextT, dur * 7, 'sine', .16)); }
      nextT += dur; step++;
    }
  }
  function start(name) {
    if (!Settings.get('music') || sfx.muted) { cur = null; return; }
    const key = Settings.get('mood') !== 'auto' ? Settings.get('mood') : name; const m = MOODS[key] || MOODS.fun;
    if (cur === m && timer) return; stop(true);
    const a = ac(); if (!a) return; master = a.createGain(); master.gain.value = 0; master.connect(a.destination); cur = m; mood = key; step = 0; melody = makeMelody(m); nextT = a.currentTime + .1;
    master.gain.setTargetAtTime(level(), a.currentTime, .6); timer = setInterval(schedule, 120); schedule();
  }
  function stop(quick) {
    clearInterval(timer); timer = null; cur = null;
    if (master) { const g = master, a = ac(); g.gain.setTargetAtTime(0, a.currentTime, quick ? .02 : .25); setTimeout(() => { try { g.disconnect(); } catch (e) { } }, 900); master = null; }
  }
  function duck(on) { ducked = on; sync(); }
  return { start, stop, sync, duck, MOODS, get playing() { return !!timer; } };
})();

/* ---------- озвучка вопросов (встроенный синтез речи браузера) ---------- */
const Voice = (() => {
  const ok = () => typeof speechSynthesis !== 'undefined' && typeof SpeechSynthesisUtterance !== 'undefined';
  const voices = () => { try { return speechSynthesis.getVoices().filter(v => /^ru/i.test(v.lang)); } catch (e) { return []; } };
  function speak(text) {
    if (!ok() || !text || !Settings.get('tts')) return false;

      u.volume = clamp(Settings.get('vol') + .2, 0, 1); u.onstart = () => Music.duck(true); u.onend = u.onerror = () => Music.duck(false);

/* ---------- мини-эффекты ---------- */
const fx = (() => {
  const lvl = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : Settings.get('fx');
  function burst(el, n = 14, cols = ['#ffc233', '#2fd6a0', '#3aa0ff', '#ff7ab8']) {
    if (lvl() === 'off' || !el || !el.getBoundingClientRect) return;
    const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2; if (lvl() === 'light') n = Math.ceil(n / 2);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 80;
      const p = h('i', { class: 'spark', style: { left: cx + 'px', top: cy + 'px', background: pick(cols), '--dx': Math.cos(a) * d + 'px', '--dy': Math.sin(a) * d - 30 + 'px' } });
      document.body.append(p); setTimeout(() => p.remove(), 900);
    }

  function flash(el, cls = 'flash-good') { if (lvl() === 'off' || !el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), 800); }
  function float(el, text) { if (lvl() === 'off' || !el) return; const r = el.getBoundingClientRect(); const t = h('b', { class: 'floater', style: { left: r.left + r.width / 2 + 'px', top: r.top + 'px' } }, text); document.body.append(t); setTimeout(() => t.remove(), 1200); }
  function confettiAmount(n) { const l = lvl(); return l === 'off' ? 0 : l === 'light' ? Math.round(n * .35) : n; }
  return { burst, flash, float, confettiAmount, lvl };
})();

/* Ходы по кругу: каждая команда играет rounds раз. play(ti, номерХода, всего, next, последний) */
function rotate(api, rounds, play) {
  const total = api.n * rounds; let i = 0;
  const next = () => { if (i >= total) return api.end(); const ti = i % api.n; i++; play(ti, i, total, next, i === total); };
  next();
}

const pts = (n) => n + ' ' + plural(n, 'очко', 'очка', 'очков');

/* Вопрос с вариантами ответов, ошибка — перехват другой командой.
   c: { ti, kicker, title, items:[{t,ok}], pts, stealPts, time, explain, last, next, steal(true) } */
function choiceRound(api, c) {
  const items = c.items, full = c.pts, half = c.stealPts ?? Math.round(full / 2);
  let done = false, stealer = -1; const wrong = new Set();
  const letters = 'АБВГДЕ';
  const bs = items.map((it, i) => h('button', { class: 'opt', type: 'button', onclick: () => pickOpt(i) }, h('b', null, letters[i]), h('span', null, it.t)));
  const info = h('div', { class: 'ans hidden' }), exp = h('div', { class: 'card hidden' }), actions = h('div', { class: 'stack' });
  const timer = c.time ? Timer(c.time, { onEnd: timeUp }) : null;
  const say = t => { info.classList.remove('hidden'); info.textContent = t; };
  function reveal() {
    done = true; if (timer) timer.stop();
    bs.forEach((b, i) => { b.classList.toggle('right', items[i].ok); b.classList.toggle('dim', !items[i].ok && !wrong.has(i)); b.disabled = true; });
    if (c.explain) { exp.classList.remove('hidden'); exp.replaceChildren(h('div', { class: 'mid-t' }, c.explain)); }
    const nb = btn(c.last ? 'Итоги' : 'Дальше', c.next, 'big', { 'data-primary': true });
    actions.replaceChildren(nb); nb.focus();
  }
  function good(who, p) { sfx.ok(); try { const b = bs.find((_, i) => items[i].ok); if (b) { b.classList.add('flash-good'); fx.burst(b); } } catch (e) {} api.score(who, p); say(api.teams[who].name + ': +' + pts(p) + '.'); reveal(); }
  function fail(i) { sfx.bad(); if (i != null && i >= 0) { bs[i].classList.add('wrong', 'shake'); bs[i].disabled = true; wrong.add(i); } }
  function steal() {
    if (c.steal === false || api.n < 2) { say('Верный ответ подсвечен.'); return reveal(); }
    const go = who => {
      stealer = who; api.setTurn(who, 'Перехватывает вопрос'); actions.replaceChildren(); say(api.teams[who].name + ', ваш шанс: верный ответ даст ' + pts(half) + '.');
      if (timer) { timer.reset(c.time); timer.start(); }
    };
    if (api.n === 2) return go(1 - c.ti);
    api.setTurn(-1, 'Перехват за половину очков', 'Кто рискнёт?');
    say('Перехват за половину очков!');
    actions.replaceChildren(api.pickTeam('Кто перехватывает?', who => who < 0 ? (say('Никто не рискнул.'), reveal()) : go(who), { exclude: [c.ti], none: 'Никто' }));
  }
  function pickOpt(i) {
    if (done) return;
    if (stealer >= 0) { if (items[i].ok) return good(stealer, half); fail(i); say('И перехват не удался.'); return reveal(); }
    if (items[i].ok) return good(c.ti, full);
    fail(i); if (timer) timer.stop(); steal();
  }
  function timeUp() { if (done) return; sfx.buzz(); if (stealer >= 0) { say('Время вышло.'); return reveal(); } say('Время вышло!'); steal(); }
  api.show([
    h('div', { class: 'card accent' + (c.pic ? ' withpic' : '') }, c.pic || null, h('div', { class: 'qbody' }, h('div', { class: 'kicker' }, c.kicker), typeof c.title === 'string' ? h('div', { class: 'big', 'data-tts': c.title }, c.title) : (c.title.setAttribute('data-tts', ''), c.title), timer ? timer.el : null)),
    h('div', { class: 'opts', 'data-tts': items.map((it, i) => 'Вариант ' + letters[i] + '. ' + it.t).join('. ') }, bs), info, exp, actions
  ], { turn: c.ti, role: c.role || 'Отвечает на вопрос' });
  if (timer) timer.start();
}

const Pics = (() => {

  function compile() {

      if (!tok) return;
      const tk0 = tok.replace(/_/g, " "); const whole = tok.endsWith('!'); const t = norm(tk0.replace(/!$/, '')).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '\\s+');
      rules.push({ e, re: new RegExp('(^|[^а-яa-z0-9])' + t + (whole ? '([^а-яa-z0-9]|$)' : '')), whole });

/* Тематические наборы (паки). DATA.themed[колода][пак] = [элементы в том же виде, что и в основной колоде]
   Паки: ny — Новый год, bday — День рождения, kids — Для детей (только детский контент), corp — Корпоратив, friends — Для друзей */
DATA.themed = DATA.themed || {};
const TH = (deck, pack) => (DATA.themed[deck] = DATA.themed[deck] || {}, DATA.themed[deck][pack] = DATA.themed[deck][pack] || []);
const tq = (pack, c, l, q, a, x, y, z) => TH('quiz', pack).push({ c, l, q, a: [a, x, y, z] });

/* 1. Выбери тему — викторина по категориям */
{
  const deck = makeDeck('quiz', DATA.quiz);
  const LV = [null, 'Лёгкий', 'Средний', 'Сложный'];
  registerGame({
    id: 'quiz', title: 'Выбери тему', icon: '🎯', color: '#ffc233',
    cats: ['Викторины', 'Для компании', 'Командные'], teams: { min: 1, max: 8 }, mins: 30,
    tagline: 'Выберите тему и сложность, ответьте на вопрос — а если ошиблись, соперники могут перехватить очки.',
    rules: '<ul><li>Команды ходят по очереди. В свой ход команда выбирает тему и сложность: 100, 200 или 300 очков.</li><li>На экране появится вопрос и четыре варианта. Обсудите и нажмите на ответ.</li><li>Верно — очки ваши. Ошиблись — соперники могут <b>перехватить</b> вопрос и получить половину очков.</li><li>Можно включить таймер: если время вышло, ответ считается неверным.</li><li>Вопросы не повторяются, пока вы не пройдёте их все.</li></ul>',
    opts: [
      { key: 'cats', label: 'Темы', multi: true, values: () => DATA.quizCats.map(c => [c.id, c.icon + ' ' + c.name]), def: [] },
      { key: 'rounds', label: 'Вопросов у каждой команды', values: [3, 5, 8], def: 5 },
      { key: 'time', label: 'Время на ответ', values: [[0, 'Без таймера'], [20, '20 секунд'], [40, '40 секунд']], def: 0 }
    ],
    cards: () => DATA.quiz.length,
    start(api) {
      rotate(api, api.opts.rounds, (ti, k, total, next, last) => {
        const sel = api.opts.cats || [], has = (c, l) => deck.has(x => x.c === c.id && x.l === l);
        const tiles = DATA.quizCats.filter(c => (!sel.length || sel.includes(c.id)) && [1, 2, 3].some(l => has(c, l))).map(c => h('div', { class: 'tile' },
          h('h3', null, h('span', null, c.icon), c.name),
          h('div', { class: 'lv' }, [1, 2, 3].filter(l => has(c, l)).map(l => btn(String(l * 100), () => ask(c, l), 'small', { title: LV[l] })))));
        api.show([
          turnHead(api, ti, 'Вопрос ' + k + ' из ' + total + '. Выберите тему и очки.'),
          h('div', { class: 'grid', style: { gridTemplateColumns: 'repeat(auto-fill,minmax(min(100%,230px),1fr))' } }, tiles)
        ], { turn: ti, role: 'Выбирает тему и очки' });
        function ask(cat, lvl) {
          const q = deck.draw(x => x.c === cat.id && x.l === lvl);
          choiceRound(api, {
            pic: Pics.of(q.q, { size: 'xl', fallback: cat.icon }), ti, kicker: cat.icon + ' ' + cat.name + ' · ' + LV[lvl] + ' · ' + pts(lvl * 100), title: q.q,
            items: shuffle(q.a.map((t, i) => ({ t, ok: i === 0 }))), pts: lvl * 100, time: api.opts.time, last, next
          });
        }
      });
    }
  });
}

/* 2. Эмодзи-кино — угадать фильм, мультфильм или сериал по смайликам */
{
  const deck = makeDeck('emoji', DATA.emoji);
  const pattern = n => n.split(' ').map(w => w[0] + w.slice(1).replace(/[А-Яа-яЁёA-Za-z0-9]/g, '_')).join('  ');
  registerGame({
    id: 'emoji', title: 'Эмодзи-кино', icon: '🎬', color: '#ff7ab8',
    cats: ['Викторины', 'Для компании', 'Для двоих'], teams: { min: 1, max: 8 }, mins: 25,
    tagline: 'Смайлики зашифровали название фильма, мультфильма или сериала. Кто угадает быстрее?',
    rules: '<ul><li>Команда видит цепочку смайликов и угадывает название. Достаточно назвать его близко к оригиналу.</li><li>Чем меньше подсказок, тем больше очков: <b>3</b> без подсказки, <b>2</b> с первой, <b>1</b> со второй.</li><li>Отвечает только команда, чей сейчас ход. Когда время вышло или она готова ответить, нажмите «Показать ответ» и отметьте, угадала ли она.</li><li>Если не угадала, остальные команды могут перехватить загадку: та, что назвала верно, получает 1 очко.</li></ul>',
    opts: [
      { key: 'types', label: 'Что загадываем', multi: true, values: ['Фильм', 'Мультфильм', 'Сериал', 'Сказка', 'Книга'], def: [] },
      { key: 'rounds', label: 'Загадок у каждой команды', values: [3, 5, 8], def: 5 },
      { key: 'level', label: 'Сложность', values: [[0, 'Любая'], [1, 'Лёгкая'], [2, 'Средняя'], [3, 'Сложная']], def: 0 },
      { key: 'time', label: 'Время на загадку', values: [[30, '30 секунд'], [45, '45 секунд'], [60, '60 секунд']], def: 45 }
    ],
    cards: () => DATA.emoji.length,
    start(api) {
      rotate(api, api.opts.rounds, (ti, k, total, next, last) => {
        const lvl = api.opts.level; const ty = api.opts.types || [], c = deck.draw(x => (!lvl || x.l === lvl) && (!ty.length || ty.includes(x.t))) || deck.draw();
        let hints = 0, revealed = false;
        const timer = Timer(api.opts.time, { onEnd: () => reveal() });
        const hintBox = h('div', { class: 'mid-t' }), actions = h('div', { class: 'row' }), after = h('div', { class: 'stack' });
        const hintBtn = btn('Подсказка (−1 очко)', () => {
          hints++; sfx.ding();
          hintBox.replaceChildren(h('div', null, c.t + ', слов в названии: ' + c.n.split(' ').length), hints > 1 ? h('div', { class: 'big', style: { letterSpacing: '.08em' } }, pattern(c.n)) : null);
          if (hints >= 2) hintBtn.disabled = true;
          kick.textContent = 'Угадайте название · ' + points() + ' ' + plural(points(), 'очко', 'очка', 'очков');
        }, 'paper');
        const points = () => Math.max(1, 3 - hints);
        const kick = h('div', { class: 'kicker' }, 'Угадайте название · 3 очка');
        function reveal() {
          if (revealed) return; revealed = true; timer.stop(); sfx.ding();
          actions.replaceChildren(); hintBtn.disabled = true;
          const p = points();
          after.replaceChildren(
            h('div', { class: 'ans' }, h('div', { class: 'kv' }, h('span', { class: 'badge' }, c.t), h('span', { class: 'big' }, c.n))),
            h('div', { class: 'stack' }, h('div', { class: 'mid-t' }, api.teams[ti].name + ' назвала название верно?'),
              h('div', { class: 'row' }, btn('Да, +' + pts(p), () => done(ti, p), 'big good', { 'data-primary': true }), btn('Нет', miss, 'big bad'))));
          api.setTurn(ti, 'Проверка ответа');
        }
        function done(who, p) {
          if (who >= 0) { api.score(who, p); sfx.ok(); } else sfx.bad();
          after.replaceChildren(btn(last ? 'Итоги' : 'Дальше', next, 'big', { 'data-primary': true })); after.firstChild.focus();
        }
        function miss() {
          sfx.bad();
          if (api.n < 2) return done(-1, 0);
          api.setTurn(-1, 'Перехват за 1 очко', 'Остальные команды');
          after.replaceChildren(h('div', { class: 'ans' }, h('div', { class: 'kv' }, h('span', { class: 'badge' }, c.t), h('span', { class: 'big' }, c.n))),
            api.pickTeam('Перехват: кто из остальных назвал название верно? (+1 очко)', who => done(who, 1), { exclude: [ti], none: 'Никто не угадал' }));
        }
        actions.append(btn('Показать ответ', reveal, 'big', { 'data-primary': true }), hintBtn);
        api.show([
          turnHead(api, ti, 'Загадка ' + k + ' из ' + total),
          h('div', { class: 'card center' }, kick, h('p', { class: 'hint' }, 'Отвечает ' + api.teams[ti].name + '. Остальные молчат: если она не угадает, будет перехват.'), h('div', { class: 'emoji-big' }, c.e), timer.el, hintBox),
          actions, after
        ], { turn: ti, role: 'Угадывает фильм по эмодзи' });
        timer.start();
      });
    }
  });
}

          pic: Pics.of(f.topic, { size: 'xl', fallback: '🕵️' }), ti, role: 'Ищет фейк', kicker: '🕵️ Тема: ' + f.topic + ' · найдите фейк · ' + pts(200), title: 'Какое утверждение — фейк?',

        });

            btn('Передать дальше', () => { passes++; sfx.click(); holder = (holder + 1) % api.n; paint(); }, 'huge', { 'data-primary': true }),
            btn('Повтор или мимо — взрыв!', () => explode('foul'), 'bad'))
        ], { turn: holder, role: 'Держит бомбу' });

}

/* 8. Ночное дело — совместное расследование со случайным преступником */
{
  registerGame({
    id: 'detective', title: 'Ночное дело', icon: '🔦', color: '#3aa0ff',
    cats: ['Загадки и истории', 'Для компании', 'Для двоих'], teams: { min: 1, max: 1 }, coop: true, noBoard: true, unit: 'Игрок', unitOne: 'игрок', unitFew: 'игрока', unitMany: 'игроков', mins: 20,
    tagline: 'Совместное расследование. Каждый раз новое преступление, новые подозреваемые, другой виновный.',
    rules: '<ul><li>Вы — следователи. На месте происшествия пропала ценная вещь, подозреваемых несколько.</li><li>В досье видны <b>цвет одежды</b> и <b>рост</b> каждого. Остальные приметы (при себе, рука, привычка) скрыты: их узнаёте, допрашивая подозреваемого.</li><li>Каждое действие тратит одну «ночь». Можно <b>опросить свидетелей</b> (одежда, рост), <b>осмотреть место</b> (вещь, рука), <b>проверить записи камер</b> (привычка) или <b>допросить</b> подозреваемого.</li><li>Нажатием на карточку можно вычеркнуть подозреваемого, если улики ему противоречат.</li><li>Обвинить можно в любой момент. Ошиблись — преступник уходит.</li></ul>',
    opts: [{ key: 'nights', label: 'Сложность (ночей на расследование)', values: [[8, 'Лёгкая, 8'], [7, 'Средняя, 7'], [6, 'Сложная, 6']], def: 7 },
      { key: 'sus', label: 'Подозреваемых', values: [5, 6, 8], def: 6 }],
    start(api) {
      const D = DATA.det;
      const sc = pick(D.places), N = api.opts.sus;
      /* имена и профессии */
      const names = shuffle([...D.male, ...D.female]).slice(0, N), roles = shuffle(sc.roles).slice(0, N);
      const attr = (k, v) => v;
      /* преступник и «двойники» по видимым приметам */
      const culprit = { coat: pick(D.coat), height: pick(D.height), item: pick(D.item), hand: pick(D.hand), trait: pick(D.trait) };
      const sus = [];
      const sameVis = N >= 6 ? 2 : 1;
      const key = s => ['coat', 'height', 'item', 'hand', 'trait'].map(k => s[k].n).join('|');
      const mkOther = vis => {
        for (let t = 0; t < 200; t++) {
          const s = { coat: pick(D.coat), height: pick(D.height), item: pick(D.item), hand: pick(D.hand), trait: pick(D.trait) };
          const same = s.coat.n === culprit.coat.n && s.height.n === culprit.height.n;
          if (vis !== same) continue;
          if (vis) { /* двойник: отличается минимум двумя скрытыми, чтобы его можно было отличить */
            let d = 0; ['item', 'hand', 'trait'].forEach(k => { if (s[k].n !== culprit[k].n) d++; });
            if (d < 2) continue;
          }
          if (sus.some(o => key(o) === key(s)) || key(s) === key(culprit)) continue;
          return s;
        }
        return null;
      };
      sus.push(culprit);
      for (let i = 0; i < sameVis; i++) { const s = mkOther(true); if (s) sus.push(s); }
      while (sus.length < N) { const s = mkOther(false); if (!s) break; sus.push(s); }
      /* ещё нужен ли второй вариант при нехватке (маловероятно) */
      const order = shuffle(range(sus.length));
      const list = order.map((idx, i) => ({ ...sus[idx], name: names[i], role: roles[i], culprit: idx === 0, open: false, out: false }));
      const guilty = list.findIndex(s => s.culprit);
      /* очереди улик */
      const q = {
        wit: shuffle(['coat', 'height']),
        scene: shuffle(['item', 'hand']),
        cam: ['trait']
      };
      const notes = [];
      let left = api.opts.nights, flash = '', mode = 'main';
      const names2 = {
        wit: ['Опросить свидетелей', 'ask'], scene: ['Осмотреть место', 'search'], cam: ['Проверить записи камер', 'cam']
      };
      render();
      function use(src) {
        if (left <= 0) return;
        if (!q[src].length) { flash = 'Здесь больше нечего узнать.'; return render(); }
        const k = q[src].shift(); left--; notes.push(culprit[k].clue); sfx.ok(); flash = ''; render();
      }
      function ask(i) {
        const s = list[i]; if (left <= 0 && !s.open) return;
        if (!s.open) { s.open = true; left--; sfx.ok(); }
        mode = 'main'; flash = 'Допрос: ' + s.name + '. ' + pick(D.mood); render();
      }
      function accuse(i) {
        const s = list[i], right = i === guilty;
        mode = 'done';
        const used = api.opts.nights - left;
        api.end({
          win: right, title: right ? 'Дело раскрыто!' : 'Преступник ушёл',
          sub: right ? s.name + ' (' + s.role.toLowerCase() + ') задержан(а). Мотив: ' + pick(D.motive) : 'Вы обвинили ' + s.name + ', но настоящий преступник — ' + list[guilty].name + ' (' + list[guilty].role.toLowerCase() + ').',
          lines: [
            'Место: ' + sc.name + '. ' + sc.what,
            'У виновного: одежда — ' + culprit.coat.n + ', рост — ' + culprit.height.n + ', при себе — ' + culprit.item.n + ', ' + culprit.hand.n + ', ' + culprit.trait.n + '.',
            'Потрачено ночей: ' + used + ' из ' + api.opts.nights + '.'
          ]
        });
      }

      /* портрет подозреваемого: цвет одежды и рост видны сразу, предмет — после допроса */
      function avatar(s) {
        const hs = Pics.hash(s.name), skin = ['#f2c9a0', '#e0a878', '#c68b5c', '#8d5a3b', '#f6d7b8'][hs % 5], hair = ['#2b1d12', '#6b3f1d', '#c9a227', '#a33b1c', '#555', '#111'][(hs >> 3) % 6];
        const coat = { 'красный': '#e84a4a', 'синий': '#3a82e0', 'зелёный': '#2f9e6a', 'чёрный': '#262633', 'серый': '#8d93a6', 'жёлтый': '#f0b72f' }[s.coat.n];
        const sc = { 'высокий': 1, 'средний': .86, 'невысокий': .72 }[s.height.n];
        const long = (hs >> 5) % 2 === 0;
        let item = '';
        if (s.open) item = {
          'очки': '<g fill="none" stroke="#111" stroke-width="2"><circle cx="43" cy="62" r="6"/><circle cx="57" cy="62" r="6"/><path d="M49 62h2"/></g>',
          'шляпа': '<ellipse cx="50" cy="48" rx="28" ry="6" fill="#5b3a29"/><path d="M36 48c0-16 28-16 28 0z" fill="#7a4e36"/>',
          'перчатки': '<circle cx="19" cy="112" r="7" fill="#f5f5f5" stroke="#999"/><circle cx="81" cy="112" r="7" fill="#f5f5f5" stroke="#999"/>',
          'портфель': '<rect x="66" y="104" width="26" height="20" rx="3" fill="#8a5a2b"/><path d="M73 104v-4h12v4" fill="none" stroke="#5a3a1a" stroke-width="2"/>',
          'зонт': '<path d="M12 70v54" stroke="#222" stroke-width="3"/><path d="M-6 76a18 16 0 0 1 36 0z" fill="#d94b8b"/>',
          'шарф': '<path d="M36 80q14 10 28 0l4 10q-18 12-36 0z" fill="#e8d3a0" stroke="#b79a5a"/>'
        }[s.item.n] || '';
        return h('div', { class: 'avatar', html: '<svg viewBox="-10 0 120 140" role="img" aria-label="' + s.name + '"><g transform="translate(50 140) scale(' + sc + ') translate(-50 -140)">' +
          '<path d="M16 140V98q0-14 20-18h28q20 4 20 18v42z" fill="' + coat + '"/><path d="M40 80l10 14 10-14z" fill="#f5f5f5" opacity=".9"/>' +
          '<rect x="44" y="72" width="12" height="12" fill="' + skin + '"/>' +
          (long ? '<path d="M30 62c0-26 40-26 40 0v22h-8V66H38v18h-8z" fill="' + hair + '"/>' : '') +
          '<circle cx="50" cy="62" r="18" fill="' + skin + '"/>' +
          '<path d="M32 60c0-22 36-22 36 0c-6-8-30-8-36 0z" fill="' + hair + '"/>' +
          '<circle cx="43" cy="63" r="2.2" fill="#222"/><circle cx="57" cy="63" r="2.2" fill="#222"/><path d="M44 71q6 4 12 0" fill="none" stroke="#7a3b2e" stroke-width="2" stroke-linecap="round"/>' +
          item + '</g>' + (s.open ? '' : '<g><circle cx="94" cy="20" r="12" fill="#ffc233"/><text x="94" y="26" text-anchor="middle" font-size="16" font-weight="800" fill="#0e1233">?</text></g>') + '</svg>' });
      }
      function card(s, i, onclick, extra) {
        return h('button', { type: 'button', class: 'susp' + (s.out ? ' out' : '') + (extra || ''), onclick },
          avatar(s), h('b', null, s.name), h('i', null, s.role),
          h('span', null, 'Одежда: ' + s.coat.n), h('span', null, 'Рост: ' + s.height.n),
          s.open ? h('span', { class: 'open' }, 'При себе: ' + s.item.n) : h('span', { class: 'lock' }, 'При себе: ?'),
          s.open ? h('span', { class: 'open' }, 'Рука: ' + s.hand.n) : h('span', { class: 'lock' }, 'Рука: ?'),
          s.open ? h('span', { class: 'open' }, 'Привычка: ' + s.trait.n) : h('span', { class: 'lock' }, 'Привычка: ?'));
      }
      function render() {
        if (mode === 'done') return;
        if (mode === 'ask' || mode === 'accuse') {
          const isAsk = mode === 'ask';
          return api.show([
            h('div', { class: 'big' }, isAsk ? 'Кого допросить?' : 'Кого обвиняем?'),

            btn('Назад', () => { mode = 'main'; render(); }, 'paper')

        api.show([
          h('div', { class: 'card accent' }, h('div', { class: 'kicker' }, sc.name), h('div', { class: 'mid-t' }, sc.what),

            withIco(btn('Обвинить', () => { mode = 'accuse'; render(); }, 'big bad', { 'data-primary': left <= 0 || undefined }), 'flag'))

      }
    }
  });
}

{

    ],

    start(api) {
      let round = 0;

      function nextRound() {
        if (round >= api.opts.rounds) return api.end();
        round++;
        const place = places.draw(), roles = shuffle(place[1].split(',')), spy = rnd(api.n), first = rnd(api.n);
        const role = i => roles[i % roles.length];
        deal(0);
        function deal(i) {
          if (i >= api.n) return party();
          handover(api, api.teams[i].name, 'Раунд ' + round + ' из ' + api.opts.rounds + '. Возьмите устройство, остальные не смотрите на экран.', () => {
            api.show([
              h('div', { class: 'card center' }, h('div', { class: 'kicker' }, 'Секретно'),
                i === spy ? h('div', null, h('div', { class: 'big' }, 'Вы — шпион'), h('p', { class: 'mid-t' }, 'Вы не знаете, где находитесь. Слушайте, задавайте вопросы и постарайтесь понять место.'))
                  : h('div', null, h('div', { class: 'kicker' }, 'Место'), h('div', { class: 'big' }, place[0]), h('p', { class: 'mid-t' }, 'Ваша роль: ' + role(i)))),
              btn(i === api.n - 1 ? 'Запомнил — к допросу' : 'Запомнил — передать дальше', () => deal(i + 1), 'big', { 'data-primary': true })
            ], { turn: i, role: 'Смотрит свою роль' });
          }, 'Показать карточку', i);
        }
        function party() {
          const timer = Timer(api.opts.time, { onEnd: () => { sfx.buzz(); vote(); } });
          api.show([
            h('div', { class: 'card accent' }, h('div', { class: 'kicker' }, 'Допрос · раунд ' + round), h('div', { class: 'mid-t' }, 'Первым задаёт вопрос ' + api.teams[first].name + '. Затем спрашивает тот, кому ответили.'), timer.el),
            h('div', { class: 'row' }, btn('Голосуем за шпиона', () => { timer.stop(); vote(); }, 'big', { 'data-primary': true }), btn('Я шпион — называю место', () => { timer.stop(); spyGuess('own'); }, 'paper'))
          ], { turn: -1, role: 'Задавайте друг другу вопросы', who: 'Все игроки' });
          timer.start();
        }
        function vote() {
          api.show([h('p', { class: 'mid-t' }, 'Обсудите и договоритесь, кого подозреваете.'), api.pickTeam('Кто, по-вашему, шпион?', who => who === spy ? spyGuess('caught') : result(false, 'Не тот. Шпионом был ' + api.teams[spy].name + '.', true))], { turn: -1, role: 'Общее голосование', who: 'Все игроки' });
        }
        function spyGuess(how) {
          const opts = shuffle(DATA.spyPlaces.map(p => p[0]));
          api.show([
            h('div', { class: 'card accent' }, h('div', { class: 'kicker' }, how === 'own' ? 'Шпион раскрылся' : 'Шпиона вычислили'), h('div', { class: 'big' }, api.teams[spy].name + ', где вы были?'), h('p', { class: 'mid-t' }, 'Назовите место. Угадаете — победа ваша.')),
            h('div', { class: 'picks' }, opts.map(p => btn(p, () => result(p === place[0], p === place[0] ? 'Шпион угадал место.' : 'Шпион ошибся, место: ' + place[0] + '.', false), 'pick')))
          ], { turn: spy, role: 'Шпион называет место' });
        }
        function result(spyWins, msg) {
          if (spyWins) api.score(spy, 2); else range(api.n).forEach(i => { if (i !== spy) api.score(i, 1); });
          spyWins ? sfx.bad() : sfx.ok();
          api.show([h('div', { class: 'cover' }, h('div', { class: 'kicker' }, 'Раунд ' + round + ' из ' + api.opts.rounds), h('div', { class: 'big' }, spyWins ? 'Шпион победил' : 'Шпиона нашли'),
            h('p', { class: 'mid-t' }, msg + ' Место: ' + place[0] + '. Шпион: ' + api.teams[spy].name + '.'),
            h('p', { class: 'mid-t' }, spyWins ? api.teams[spy].name + ' получает 2 очка.' : 'Остальные получают по очку.'),
            btn(round >= api.opts.rounds ? 'Итоги' : 'Следующий раунд', nextRound, 'big', { 'data-primary': true }))], { turn: -1, mid: true, role: 'Итог раунда', who: 'Все игроки' });
        }
      }
    }

            h('div', { class: 'row' }, btn('Запомнил — рисую!', play, 'big', { 'data-primary': true }), skip > 0 ? btn('Другое слово', () => { skip--; card = deck.draw(filt); reveal(); }, 'paper') : null)], { turn: ti, mid: true, role: 'Запоминает слово' });

/* 29. Ассоциации — цепочка слов на скорость */
{
  const deck = makeDeck('assoc', DATA.assocSeeds);
  registerGame({
    id: 'assoc', title: 'Ассоциации', icon: '🔗', color: '#e0508f',
    cats: ['Для компании', 'Командные', 'Для двоих'], teams: { min: 2, max: 8 }, mins: 15,

    opts: [
      { key: 'rounds', label: 'Раундов', values: [2, 3, 5], def: 3 },
      { key: 'time', label: 'Время на слово', values: [[6, '6 секунд'], [10, '10 секунд'], [15, '15 секунд']], def: 10 },
      { key: 'lives', label: 'Жизней у команды', values: [1, 2, 3], def: 2 }
    ],
    cards: () => DATA.assocSeeds.length,
    start(api) {
      let round = 0, first = 0;
      newRound();
      function newRound() {
        round++; if (round > api.opts.rounds) return api.end();
        const seed = deck.draw(), lives = range(api.n).map(() => api.opts.lives), out = [];
        let ti = first % api.n, count = 0; first++;
        const alive = () => range(api.n).filter(i => lives[i] > 0);
        const nextAlive = i => { for (let k = 1; k <= api.n; k++) { const j = (i + k) % api.n; if (lives[j] > 0) return j; } return i; };
        api.show(h('div', { class: 'cover' }, h('div', { class: 'kicker' }, 'Раунд ' + round + ' из ' + api.opts.rounds), h('div', { class: 'kicker' }, 'Первое слово'), h('div', { class: 'big', 'data-tts': seed }, seed),
          h('p', { class: 'mid-t' }, api.teams[ti].name + ' начинает: назовите ассоциацию к этому слову.'), btn('Поехали', turn, 'big', { 'data-primary': true })), { turn: ti, mid: true, role: 'Начинает цепочку' });
        function turn() {
          const timer = Timer(api.opts.time, { onEnd: () => miss('Время вышло.') }), name = api.teams[ti].name;
          const livesEl = h('div', { class: 'lives' }, ...range(api.n).map(i => h('span', { class: 'lv' + (lives[i] > 0 ? '' : ' out'), style: { '--c': api.teams[i].color } }, api.teams[i].name + ' ' + (lives[i] > 0 ? '♥'.repeat(lives[i]) : '✕'))));
          api.show([h('div', { class: 'card accent' }, h('div', { class: 'kicker' }, 'Цепочка: ' + count + ' ' + plural(count, 'слово', 'слова', 'слов')), h('div', { class: 'big' }, count ? 'Ассоциация к последнему слову' : 'Ассоциация к слову «' + seed + '»'), timer.el), livesEl,
            h('div', { class: 'row' }, btn('Назвали', ok, 'big good', { 'data-primary': true }), btn('Не вышло', () => miss('Повтор или не нашли слово.'), 'big bad'))], { turn: ti, role: 'Называет ассоциацию' });
          timer.start();
          function ok() { timer.stop(); count++; sfx.ok(); ti = nextAlive(ti); turn(); }
          function miss(why) {
            timer.stop(); sfx.buzz(); const who = ti; lives[who]--;
            if (lives[who] <= 0) out.push(who);
            const left = alive();
            if (left.length <= 1) return endRound(left[0]);
            ti = nextAlive(who);
            api.show(h('div', { class: 'cover' }, h('div', { class: 'kicker' }, why), h('div', { class: 'big' }, name + (lives[who] > 0 ? ': осталось ' + '♥'.repeat(lives[who]) : ' выбывает')),
              btn('Дальше', turn, 'big', { 'data-primary': true })), { turn: ti, mid: true, role: 'Следующая команда' });
          }
        }

/* ---- src/games/g30_cities.js ---- */
/* 30. Города — цепочка городов по последней букве */
{
  const CITIES = [...new Set(DATA.cities)], norm = s => s.toLowerCase().replace(/ё/g, 'е').replace(/[^а-яa-z]/g, '');
  const SET = new Set(CITIES.map(norm));
  const tail = c => { const t = norm(c).replace(/[ьъый]+$/, ''); return t[t.length - 1]; };
  const head = c => norm(c)[0];
  const byLetter = {}; CITIES.forEach(c => { (byLetter[head(c)] = byLetter[head(c)] || []).push(c); });
  const STARTS = 'авкмнпрсбтчелдгоуш'.split('').filter(l => byLetter[l] && byLetter[l].length > 4);
  registerGame({
    id: 'cities', title: 'Города', icon: '🏙️', color: '#4f9d4c',
    cats: ['Для компании', 'Командные', 'Для двоих'], teams: { min: 2, max: 6 }, mins: 15,
    tagline: 'Называйте города по цепочке: каждый следующий начинается с последней буквы предыдущего.',
    rules: '<ul><li>Первая команда называет город на заданную букву. Следующая — город на последнюю букву предыдущего. Буквы «ь», «ъ», «ы», «й» в конце пропускаются.</li><li>Город нужно ввести на клавиатуре. Если такого города нет в базе, компания решает, засчитывать ли его.</li><li>Повторять города нельзя. Не успели или не знаете — команда выбывает. Последняя оставшаяся выигрывает раунд: 3 очка, плюс очко за каждый названный город.</li></ul>',
    opts: [
      { key: 'rounds', label: 'Раундов', values: [1, 2, 3], def: 2 },
      { key: 'time', label: 'Время на ход', values: [[20, '20 секунд'], [30, '30 секунд'], [45, '45 секунд']], def: 30 }
    ],
    cards: () => CITIES.length,
    start(api) {
      let round = 0, first = 0;
      newRound();
      function newRound() {
        round++; if (round > api.opts.rounds) return api.end();
        let ti = first % api.n; first++;
        const used = new Set(), chain = [], out = []; let need = pick(STARTS);
        const alive = () => range(api.n).filter(i => !out.includes(i));
        const nextAlive = i => { for (let k = 1; k <= api.n; k++) { const j = (i + k) % api.n; if (!out.includes(j)) return j; } return i; };
        api.show(h('div', { class: 'cover' }, h('div', { class: 'kicker' }, 'Раунд ' + round + ' из ' + api.opts.rounds), h('div', { class: 'big' }, 'Первая буква: ' + need.toUpperCase()), h('p', { class: 'mid-t' }, api.teams[ti].name + ' начинает. Введите город и нажмите Enter.'), btn('Поехали', turn, 'big', { 'data-primary': true })), { turn: ti, mid: true, role: 'Начинает цепочку' });
        function turn() {
          const name = api.teams[ti].name, timer = Timer(api.opts.time, { onEnd: () => drop('Время вышло.') });
          const inp = h('input', { class: 'input city-in', type: 'text', placeholder: 'Город на «' + need.toUpperCase() + '»', 'aria-label': 'Город', autocomplete: 'off', enterkeyhint: 'done' });
          const msg = h('div', { class: 'mid-t' }), chips = h('div', { class: 'chips' }, ...chain.slice(-6).map(c => h('span', { class: 'chip' }, c)));
          const submit = () => {
            const raw = inp.value.trim(), n = norm(raw); if (!n) return;
            if (head(raw) !== need) { sfx.bad(); msg.textContent = 'Город должен начинаться на «' + need.toUpperCase() + '».'; return; }
            if (used.has(n)) { sfx.bad(); msg.textContent = 'Этот город уже называли.'; return; }
            const pretty = CITIES.find(c => norm(c) === n) || raw[0].toUpperCase() + raw.slice(1);
            if (SET.has(n)) return accept(pretty);
            timer.stop(); confirmBox('Города «' + raw + '» нет в базе игры. Он существует и вы засчитываете его?', () => accept(pretty), 'Засчитать', 'Не засчитывать', () => { timer.start(); msg.textContent = 'Назовите другой город.'; inp.select(); });
          };
          inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
          api.show([h('div', { class: 'card accent' }, h('div', { class: 'kicker' }, 'Город на букву'), h('div', { class: 'big' }, need.toUpperCase()), timer.el, chips),
            h('div', { class: 'row' }, inp, btn('Ответить', submit, 'big', { 'data-primary': true })), msg,
            h('div', { class: 'row' }, btn('Не знаем город', () => drop('Команда сдаётся.'), 'paper'))], { turn: ti, role: 'Называет город' });
          timer.start(); setTimeout(() => inp.focus(), 50);
          function accept(city) { timer.stop(); used.add(norm(city)); chain.push(city); api.score(ti, 1); sfx.ok(); need = tail(city); ti = nextAlive(ti); turn(); }
          function drop(why) {
            timer.stop(); sfx.buzz(); const who = ti; out.push(who);
            const left = alive(); if (left.length <= 1) return endRound(left[0]);
            ti = nextAlive(who);
            api.show(h('div', { class: 'cover' }, h('div', { class: 'kicker' }, why), h('div', { class: 'big' }, name + ' выбывает'), h('p', { class: 'mid-t' }, 'Нужна буква «' + need.toUpperCase() + '». Следующий ход: ' + api.teams[ti].name + '.'), btn('Дальше', turn, 'big', { 'data-primary': true })), { turn: ti, mid: true, role: 'Следующая команда' });
          }
        }
        function endRound(w) {
          if (w != null) api.score(w, 3); sfx.ok();
          api.show(h('div', { class: 'cover' }, h('div', { class: 'kicker' }, 'Раунд окончен · названо городов: ' + chain.length), h('div', { class: 'big' }, w != null ? api.teams[w].name + ' выигрывает: +3' : 'Ничья'),
            btn(round >= api.opts.rounds ? 'Итоги' : 'Следующий раунд', newRound, 'big', { 'data-primary': true })), { turn: -1, mid: true, role: 'Итог раунда' });
        }
      }
    }
  });
}
